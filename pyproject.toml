[project]
name = "liberty-v2"
version = "0.0.1"
description = "Liberty v2 — connector-driven low-code framework"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastapi-cli>=0.0.7",  # the `fastapi dev` / `fastapi run` CLI
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",       # PostgreSQL async driver  (postgresql+asyncpg://)
    "oracledb>=2.5",       # Oracle async driver (thin mode)  (oracle+oracledb://) — for migrated JDE pools
    "httpx>=0.27",
    "anthropic>=0.40",
    "authlib>=1.3.2",
    "itsdangerous>=2.1",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42",  # field-level AES-256-GCM (v1-compatible) — liberty.crypto
    "tomli-w>=1.0",  # write connectors.toml (migration tools)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[project.scripts]
liberty-v2 = "liberty.main:run"
liberty-connectors = "liberty.cli:main"
liberty-admin = "liberty.admin_cli:main"
liberty-migrate = "liberty.migrate_cli:main"
liberty-crypto = "liberty.crypto_cli:main"
liberty-license = "liberty.license_cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["liberty*"]

[tool.setuptools.package-data]
"liberty.licensing" = ["public.pem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
