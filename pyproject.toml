[project]
name = "liberty-v2"
version = "0.0.1"
description = "Liberty v2 — connector-driven low-code framework"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "httpx>=0.27",
    "anthropic>=0.40",
    "authlib>=1.3.2",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[project.scripts]
liberty-v2 = "liberty.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["liberty*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
