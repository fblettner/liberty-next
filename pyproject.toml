[project]
name = "liberty-next"
version = "7.0.60"
description = "Liberty Next — connector-driven low-code framework (SQL + API connectors, React admin UI, AI tool-use assistant, dependency-aware deployment packaging)"
readme = "README.md"
license = {text = "Open framework (free); licensed connectors sold separately — see repository"}
authors = [
    {name = "Franck Blettner", email = "franck.blettner@nomana-it.fr"},
]
maintainers = [
    {name = "Franck Blettner", email = "franck.blettner@nomana-it.fr"},
]
keywords = [
    "low-code", "framework", "fastapi", "react", "sql", "connector",
    "postgres", "oracle", "dashboard", "etl", "scheduler", "openapi",
    "anthropic", "ai", "tool-use", "admin", "toml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastapi-cli>=0.0.7",  # the `fastapi dev` / `fastapi run` CLI
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",       # PostgreSQL async driver  (postgresql+asyncpg://)
    "oracledb>=2.5",       # Oracle async driver (thin mode)  (oracle+oracledb://) — for migrated JDE pools
    "aiosqlite>=0.20",     # SQLite async driver — the shipped [pools.default] URL and the Light layout use it;
                           # was dev-only until 7.0.58, so the image could not open its own default pool
    "httpx>=0.27",
    "anthropic>=0.40",
    "authlib>=1.3.2",
    "itsdangerous>=2.1",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",   # multipart form parsing — POST /admin/import-package (a ZIP upload); FastAPI needs it explicitly
    "PyJWT>=2.9",          # access / refresh JWTs (HS256) — replaced python-jose (unmaintained) in 7.0.57
    "cryptography>=42",  # field-level AES-256-GCM (v1-compatible) — liberty.crypto
    "tomli-w>=1.0",  # write connectors.toml (migration tools)
    "tomlkit>=0.13",  # comment/format-preserving TOML edits — the config builders (POST/PUT /admin/config/*)
    "openpyxl>=3.1",  # workbook export — multi-file / multi-sheet xlsx (v1's tbl_workbook / tbl_sheet feature)
    "python-socketio>=5.11",   # Socket.IO server — record locks (rooms-as-locks, v1 pattern) + technical dashboard / log tail
    "apscheduler>=3.11,<4",   # nomaflow (Phase 13a) — in-process cron + interval scheduler (4.0 still pre-release on PyPI)
    "watchfiles>=0.21",       # filesystem watcher behind ``[app] hot_reload = true`` — picks up TOML edits without an explicit /admin/reload
    "markdown>=3.7",          # markdown → HTML for the report pipeline (extensions: tables, fenced_code, toc, attr_list, md_in_html, sane_lists, nl2br)
    "jinja2>=3.1",            # markdown templating used by plugin reports (e.g. nomasx1.reports.audit_licences); hosted in the framework so plugin packages stay zero-dep
]

# Optional extras — the core install boots and serves everything except the three features
# below. The Docker image, the dev venv (start.sh) and CI install ``[all]``.
#   reports  → PDF output of /api/reports (markdown output needs nothing). WeasyPrint needs
#              system libs: libpango, libpangoft2, libharfbuzz, libfontconfig (apt / brew).
#   ldap     → the nomaflow ``ldap_sync`` step (ldap3, pure Python).
#   alembic  → the licensed apps' schema migrations (plugins/<name>/db/alembic/) — Alembic's
#              online runner is sync, hence psycopg2 next to the async asyncpg pool.
[project.optional-dependencies]
reports = ["weasyprint>=63.0"]
ldap = ["ldap3>=2.9"]
alembic = ["alembic>=1.13", "psycopg2-binary>=2.9"]
all = ["liberty-next[reports,ldap,alembic]"]
dev = [
    "liberty-next[all]",       # the test suite renders PDFs and exercises the ldap step
    "pytest>=8.3",
    "ruff>=0.17",              # lint — `ruff check liberty tests` (config: [tool.ruff] below); CI runs it
    "pytest-asyncio>=0.24",
    "pytest-html>=4.1",        # `pytest --html=test-report.html --self-contained-html` → browsable HTML report
    "aiohttp>=3.10",     # required by python-socketio's AsyncClient (test_sio.py)
]

[project.scripts]
liberty-next = "liberty.main:run"
liberty-connectors = "liberty.cli:main"
liberty-admin = "liberty.admin_cli:main"
liberty-migrate = "liberty.migrate_cli:main"
liberty-crypto = "liberty.crypto_cli:main"
liberty-license = "liberty.license_cli:main"
liberty-ops = "liberty.ops_cli:main"            # Python-install operations (the Docker twin is release/liberty)

# [project.urls] populates the sidebar links on the PyPI project page. Order matters —
# PyPI renders them top-to-bottom; put the things people will click most at the top.
[project.urls]
Homepage = "https://github.com/fblettner/liberty-next"
Documentation = "https://docs.nomana-it.fr/liberty/getting-started/"
Source = "https://github.com/fblettner/liberty-next"
Issues = "https://github.com/fblettner/liberty-next/issues"
Releases = "https://github.com/fblettner/liberty-next/releases"
"Container Registry" = "https://github.com/fblettner/liberty-next/pkgs/container/liberty-next"
"Deployment Configs" = "https://github.com/fblettner/liberty-next/tree/main/release"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["liberty*"]

[tool.setuptools.package-data]
"liberty.licensing" = ["public.pem"]
"liberty" = ["RELEASE.md", "RELEASE.fr.md"]   # release notes shipped with the wheel (served at /admin/release-notes)

# ── ruff: the lint baseline (A5, 2026-10-26). Chosen from a measurement, not aspiration:
# pyflakes + pycodestyle + bugbear pass clean after the fixes in this commit; import sorting
# (I), pyupgrade (UP) and the async blocking-call rules (ASYNC240, the ~100 ms config
# writes) are deliberately NOT enabled yet — they'd be a 300-line mechanical diff for no
# behaviour change. Line length: 120 is where the code sits; E501 stays off until the long
# docstring tails are wrapped. ``ruff format`` is not adopted (the code has its own style).
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["F", "E", "W", "B"]
ignore = [
    "E501",  # line length — measured 418 lines over 120; wrap them before turning this on
    "E701", "E702",  # one-line `if x: y` / `a; b` — used deliberately in dense config helpers
    "E741",  # `l` is the per-language translations map in the TOML schemas (ColumnHint.l, MenuItem.l, …)
    "B008",  # FastAPI `Depends()` / `Body()` in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]  # `pytest.raises(Exception)` is fine in a test
# Mid-file imports placed next to the section they serve (big, sectioned modules).
"liberty/connectors/sql.py" = ["E402"]
"liberty/web/admin.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
