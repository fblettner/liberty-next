[project]
name = "liberty-next"
version = "7.0.29"
description = "Liberty Next — connector-driven low-code framework (SQL + API connectors, React admin UI, AI tool-use assistant, dependency-aware deployment packaging)"
readme = "README.md"
license = {text = "Open framework (free); licensed connectors sold separately — see repository"}
authors = [
    {name = "Franck Blettner", email = "franck.blettner@nomana-it.fr"},
]
maintainers = [
    {name = "Franck Blettner", email = "franck.blettner@nomana-it.fr"},
]
keywords = [
    "low-code", "framework", "fastapi", "react", "sql", "connector",
    "postgres", "oracle", "dashboard", "etl", "scheduler", "openapi",
    "anthropic", "ai", "tool-use", "admin", "toml",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database :: Front-Ends",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Office/Business",
    "Typing :: Typed",
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "fastapi-cli>=0.0.7",  # the `fastapi dev` / `fastapi run` CLI
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",       # PostgreSQL async driver  (postgresql+asyncpg://)
    "oracledb>=2.5",       # Oracle async driver (thin mode)  (oracle+oracledb://) — for migrated JDE pools
    "httpx>=0.27",
    "anthropic>=0.40",
    "authlib>=1.3.2",
    "itsdangerous>=2.1",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42",  # field-level AES-256-GCM (v1-compatible) — liberty.crypto
    "tomli-w>=1.0",  # write connectors.toml (migration tools)
    "tomlkit>=0.13",  # comment/format-preserving TOML edits — the config builders (POST/PUT /admin/config/*)
    "openpyxl>=3.1",  # workbook export — multi-file / multi-sheet xlsx (v1's tbl_workbook / tbl_sheet feature)
    "python-socketio>=5.11",   # Socket.IO server — record locks (rooms-as-locks, v1 pattern) + technical dashboard / log tail
    "fastapi-socketio>=0.0.10",   # mounts python-socketio on a FastAPI app
    "apscheduler>=3.11,<4",   # nomaflow (Phase 13a) — in-process cron + interval scheduler (4.0 still pre-release on PyPI)
    "watchfiles>=0.21",       # filesystem watcher behind ``[app] hot_reload = true`` — picks up TOML edits without an explicit /admin/reload
    "alembic>=1.13",          # nomaflow plugins ship versioned schema migrations (plugins/<name>/db/alembic/) — the upgrade path
    "psycopg2-binary>=2.9",   # sync Postgres driver — Alembic's online runner is sync (the async asyncpg pool is unused there)
    "ldap3>=2.9",             # LDAP / Active Directory client — used by the nomasx1.ldap plugin (sync client, called via asyncio.to_thread). Pure Python, no native deps.
    "weasyprint>=63.0",       # report renderer (markdown → PDF) — needs system libs: libpango, libpangoft2, libharfbuzz, libfontconfig (apt/brew)
    "markdown>=3.7",          # markdown → HTML for the report pipeline (extensions: tables, fenced_code, toc, attr_list, md_in_html, sane_lists, nl2br)
    "jinja2>=3.1",            # markdown templating used by plugin reports (e.g. nomasx1.reports.audit_licences); hosted in the framework so plugin packages stay zero-dep
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-html>=4.1",        # `pytest --html=test-report.html --self-contained-html` → browsable HTML report
    "aiosqlite>=0.20",
    "aiohttp>=3.10",     # required by python-socketio's AsyncClient (test_sio.py)
]

[project.scripts]
liberty-next = "liberty.main:run"
liberty-connectors = "liberty.cli:main"
liberty-admin = "liberty.admin_cli:main"
liberty-migrate = "liberty.migrate_cli:main"
liberty-crypto = "liberty.crypto_cli:main"
liberty-license = "liberty.license_cli:main"

# [project.urls] populates the sidebar links on the PyPI project page. Order matters —
# PyPI renders them top-to-bottom; put the things people will click most at the top.
[project.urls]
Homepage = "https://github.com/fblettner/liberty-next"
Documentation = "https://docs.nomana-it.fr/liberty/getting-started/"
Source = "https://github.com/fblettner/liberty-next"
Issues = "https://github.com/fblettner/liberty-next/issues"
Releases = "https://github.com/fblettner/liberty-next/releases"
"Container Registry" = "https://github.com/fblettner/liberty-next/pkgs/container/liberty-next"
"Deployment Configs" = "https://github.com/fblettner/liberty-next/tree/main/release"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["liberty*"]

[tool.setuptools.package-data]
"liberty.licensing" = ["public.pem"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
