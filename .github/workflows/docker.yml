# Build + push a rolling Docker image for every commit on main (the ``edge`` tag).
#
# Versioned releases (e.g. ghcr.io/.../liberty-next:0.1.0 + :latest) are handled by
# .github/workflows/release.yml (manual ``workflow_dispatch`` — one button, one version,
# publishes BOTH Docker + PyPI atomically). This workflow exists only for the rolling
# ``edge`` channel so you can pull "current main" without chasing the SHA.
#
# Triggers:
#   - Push to ``main``       → ``edge`` + ``sha-<short>`` tags
#   - Pull request           → build only (no push), so a Dockerfile breakage fails CI
#   - Manual dispatch        → rebuild on demand (e.g. after a base-image security fix)

name: Docker (edge)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build + push edge (${{ github.ref_name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        # Skipped on PRs from forks — they don't have a writable GITHUB_TOKEN.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags + labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/liberty-next
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=Liberty Next
            org.opencontainers.image.description=Connector-driven low-code framework (edge channel)
            org.opencontainers.image.vendor=Liberty
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=See repository

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
