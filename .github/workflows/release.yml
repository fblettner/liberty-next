# Liberty Next — release on every push to main.
#
# Branch model:
#   develop  — work happens here. Pushes trigger NOTHING (no docker rebuild, no
#              release, no PyPI). Use freely.
#   main     — every push (typically a PR merge from develop) triggers ONE release
#              that publishes the same version to ghcr.io AND PyPI atomically.
#
# Version resolution (no manual button needed):
#   1. Read pyproject.toml's [project] version.
#   2. If a git tag for that version already exists → auto-bump the patch component
#      (7.0.1 → 7.0.2), write it back to pyproject.toml, commit with [skip ci] so
#      this workflow doesn't infinite-loop, then proceed with the bumped version.
#   3. Otherwise (you manually bumped pyproject.toml for a major / minor) → use
#      that version directly, no extra commit.
#
# So:
#   - Normal "ship a bugfix" flow: edit code, push to develop, PR + merge to main.
#     Workflow auto-bumps to the next patch version. Zero manual config.
#   - "Ship a minor / major version" flow: bump pyproject.toml yourself in the same
#     commit (or earlier), push, merge. Workflow honours your version.
#
# Manual override:
#   The workflow_dispatch trigger keeps a "Run workflow" button for cases where you
#   want to re-publish a specific version (rebuild Docker after a base-image CVE,
#   for example). The optional version input lets you specify exactly what to build.

name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional — override the resolved version (leave empty for auto). Leading "v" is tolerated.'
        required: false
        type: string
        default: ''

permissions:
  contents: write     # commit the version bump + create the git tag + GitHub release
  packages: write     # push to ghcr.io

concurrency:
  # One release at a time. Serialise (don't cancel) to avoid two pushes racing for
  # the same version slot.
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Skip when the trigger is the workflow's OWN version-bump commit (defense in
    # depth — [skip ci] in the message is the primary guard, this catches edge cases).
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history for tag detection
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── resolve the version ──────────────────────────────────────────────────
      - name: Resolve version
        id: ver
        run: |
          set -e
          OVERRIDE="${{ inputs.version }}"
          PKG_VERSION=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")

          if [ -n "$OVERRIDE" ]; then
            VERSION="${OVERRIDE#v}"
            echo "Manual override → $VERSION"
          else
            # Does a tag for pyproject.toml's current version exist?
            git fetch --tags --quiet
            if git rev-parse "refs/tags/v$PKG_VERSION" >/dev/null 2>&1; then
              # Yes → auto-bump the patch
              IFS=. read -r MAJOR MINOR PATCH <<< "$PKG_VERSION"
              if ! [[ "$PATCH" =~ ^[0-9]+$ ]]; then
                echo "::error::Cannot auto-bump non-numeric patch: $PATCH (in $PKG_VERSION). Bump pyproject.toml manually."
                exit 1
              fi
              VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
              echo "v$PKG_VERSION already tagged → auto-bumping to $VERSION"
            else
              # No → use pyproject.toml as-is (operator bumped it manually)
              VERSION="$PKG_VERSION"
              echo "v$PKG_VERSION not yet tagged → using as-is"
            fi
          fi

          # Validate
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+].+)?$'; then
            echo "::error::Resolved version '$VERSION' is not a valid SemVer."
            exit 1
          fi
          # Also re-check the resolved version isn't already tagged (race / typo).
          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists. Bump pyproject.toml manually."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"    >> "$GITHUB_OUTPUT"
          echo "✔ Releasing version=$VERSION (tag=v$VERSION)"

      # ── sync pyproject.toml + ensure RELEASE.md has the version section + commit ──
      # Also guarantees the changelog stays complete: every released version gets a
      # ``## <version> — <date>`` heading in liberty/RELEASE.md (the Settings → History →
      # Upgrades detail renders it). A stub is inserted when missing — common on an auto-bumped
      # patch where the version isn't known until release time — with a ::warning:: nudging the
      # author to fill it in. A real section the author already wrote is left untouched.
      - name: Bump pyproject.toml + ensure RELEASE.md section
        id: bump
        env:
          RESOLVED: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -e
          python3 - <<'PY'
          import os, re, pathlib, datetime
          resolved = os.environ["RESOLVED"]

          # 1) pyproject version — bump only when the workflow resolved a different value.
          pp = pathlib.Path("pyproject.toml")
          txt = pp.read_text()
          cur = re.search(r'(?m)^version\s*=\s*"([^"]+)"', txt).group(1)
          if cur != resolved:
              new = re.sub(r'(?m)^version\s*=\s*"[^"]+"', f'version = "{resolved}"', txt, count=1)
              if new == txt:
                  raise SystemExit("pyproject.toml version line not found")
              pp.write_text(new)

          # 2) RELEASE.md must carry a "## <resolved>" section — insert a stub (newest, on top) if absent.
          rn = pathlib.Path("liberty/RELEASE.md")
          md = rn.read_text() if rn.exists() else "# Liberty Next — Release notes\n"
          if not re.search(r'(?m)^##\s+' + re.escape(resolved) + r'\b', md):
              stub = f"## {resolved} — {datetime.date.today().isoformat()}\n\n- _Release notes pending — edit liberty/RELEASE.md._\n\n"
              m = re.search(r'(?m)^## ', md)            # before the first existing version section
              md = (md[:m.start()] + stub + md[m.start():]) if m else (md.rstrip() + "\n\n" + stub)
              rn.write_text(md)
              print(f"::warning::liberty/RELEASE.md had no section for {resolved} — inserted a stub. Edit it to describe the release.")
          PY

          # Commit whatever changed (pyproject and/or RELEASE.md). Nothing changed → no commit.
          if git diff --quiet; then
            echo "nothing to commit"; echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml liberty/RELEASE.md
            git commit -m "release: ${TAG} [skip ci]"
            git push origin HEAD:main
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── build the Python distributions ───────────────────────────────────────
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist + wheel
        run: |
          python -m build
          python -m twine check dist/*
          ls -lh dist/

      # ── build + push the Docker image ────────────────────────────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/liberty-next:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/liberty-next:latest
          labels: |
            org.opencontainers.image.title=Liberty Next
            org.opencontainers.image.description=Connector-driven low-code framework
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── publish to PyPI (LAST irreversible step) ─────────────────────────────
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}

      # ── tag + GitHub release ─────────────────────────────────────────────────
      - name: Create + push annotated git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          body: |
            **Liberty Next ${{ steps.ver.outputs.tag }}**

            - **PyPI:** https://pypi.org/project/liberty-next/${{ steps.ver.outputs.version }}/
            - **Docker:** `ghcr.io/${{ github.repository_owner }}/liberty-next:${{ steps.ver.outputs.version }}`
            - **Docs:** https://docs.nomana-it.fr/liberty/getting-started/

            ### Install

            ```bash
            pipx install liberty-next==${{ steps.ver.outputs.version }}
            # OR
            docker pull ghcr.io/${{ github.repository_owner }}/liberty-next:${{ steps.ver.outputs.version }}
            ```
