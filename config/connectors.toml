sql = "SELECT DISTINCT\n    USR_APPS_ID,\n    USR_ID,\n    USR_NAME,\n    CASE WHEN USR_STATUS = '01' THEN '01' ELSE 'N' END USR_STATUS,\n    USRD_ULCTR,\n    USRD_MCCO,\n    USRD_MCMCU,\n    USRD_MCRP08,\n    USR_DT_CREATION,    \n    CPT_COMPONENT,\n    LAST_USAGE\nFROM\n    SECURITY_USERS_DATA\nINNER JOIN\n    SECURITY_USERS\n    ON USR_ID = USRD_ID \nLEFT JOIN\n    (SELECT \n        LOUT_APPS_ID, \n        CPT_COMPONENT,\n        LOUT_USER, \n        MAX(LOUT_USAGE) LAST_USAGE \n    FROM\n      LICENSE_JDE_OUT \n    INNER JOIN\n      JDE_OBJECTS\n      ON JDEO_APPS_ID = LOUT_APPS_ID\n      AND JDEO_OBJECT = LOUT_OBJECT\n    INNER JOIN\n      SETTINGS_JDE_SY\n      ON JDEO_SY = SYC_ID\n    INNER JOIN \n      SETTINGS_LIC_COMPONENTS\n      ON SYC_CPT_ID = CPT_ID\n    GROUP BY\n        LOUT_APPS_ID, \n        CPT_COMPONENT,\n        LOUT_USER\n    )\n    ON LOUT_USER = USR_ID AND LOUT_APPS_ID = USR_APPS_ID\nORDER BY USR_APPS_ID, USR_ID, CPT_COMPONENT"
