sql = "SELECT * FROM (\nWITH userRole AS\n(\nSELECT \n  ABALPH ALPH,\n  ULUSER USER_ROLE\nFROM\n  #SCHEMA.SY#.F0092\nLEFT JOIN\n  #SCHEMA.DTA#.F0101\n  ON ABAN8 = ULAN8\nWHERE\n  ULUGRP <> '*GROUP'\nUNION ALL\nSELECT \n    AUROLEDESC ALPH,\n    AUUSER USER_ROLE\nFROM\n  #SCHEMA.SY#.F00926\n)\nSELECT \n    TRIM(FSSETY) FSSETY,\n    CASE \n      WHEN TRIM(FSSETY) IN ('1', '3', '5', '9') THEN 'OBJECTS'\n      WHEN TRIM(FSSETY) IN ('2', '4', 'B') THEN 'ALIAS'\n      WHEN TRIM(FSSETY) NOT IN ('1', '3', '5', '9', '2', '4', 'B') THEN 'OTHERS'\n    END SEC_TYPE,\n    FSUSER,\n    ALPH,\n    TRIM(FSOBNM) FSOBNM ,\n    TRIM(FSDTAI) FSDTAI ,\n    TRIM(FSFRDV) FSFRDV ,\n    TRIM(FSSY) FSSY,\n    FSOWDI,\n    FSFMNM,\n    FSFUNO,\n    FSINSL,\n    FSRUN,\n    FSVWYN,\n    FSA,\n    FSCHNG,\n    FSDLT,\n    FSTHDV,\n    FSOBID,\n    FSADDC,\n    FSIOK,\n    FSICPY,\n    FSIUPT,\n    FSATN1,\n    FSATN2,\n    FSATN3,\n    FSMUSE,\n    FSPID,\n    FSJOBN,\n    FSUPMJ,\n    FSUPMT,\n    FSEXITID,\n    FSTABID,\n    FSTEXTID,\n    FSPTH \nFROM \n  #SCHEMA.SY#.F00950\nLEFT JOIN\n  userRole\n  ON FSUSER = USER_ROLE\n) _flt\nWHERE 1=1\n  AND ((CAST(:SEC_TYPE AS VARCHAR(4000)) IS NULL OR CAST(:SEC_TYPE AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:SEC_TYPE_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.SEC_TYPE AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:SEC_TYPE AS VARCHAR(4000)) || '%')) OR (CAST(:SEC_TYPE_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.SEC_TYPE AS VARCHAR(4000)) = CAST(:SEC_TYPE AS VARCHAR(4000))) OR (CAST(:SEC_TYPE_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.SEC_TYPE AS VARCHAR(4000)) <> CAST(:SEC_TYPE AS VARCHAR(4000))) OR (CAST(:SEC_TYPE_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.SEC_TYPE AS VARCHAR(4000))) LIKE LOWER(CAST(:SEC_TYPE AS VARCHAR(4000)) || '%')) OR (CAST(:SEC_TYPE_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.SEC_TYPE AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:SEC_TYPE AS VARCHAR(4000)))))\n  AND ((CAST(:FSSETY AS VARCHAR(4000)) IS NULL OR CAST(:FSSETY AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:FSSETY_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.FSSETY AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:FSSETY AS VARCHAR(4000)) || '%')) OR (CAST(:FSSETY_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.FSSETY AS VARCHAR(4000)) = CAST(:FSSETY AS VARCHAR(4000))) OR (CAST(:FSSETY_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.FSSETY AS VARCHAR(4000)) <> CAST(:FSSETY AS VARCHAR(4000))) OR (CAST(:FSSETY_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.FSSETY AS VARCHAR(4000))) LIKE LOWER(CAST(:FSSETY AS VARCHAR(4000)) || '%')) OR (CAST(:FSSETY_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.FSSETY AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:FSSETY AS VARCHAR(4000)))))\n  AND ((CAST(:FSUSER AS VARCHAR(4000)) IS NULL OR CAST(:FSUSER AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:FSUSER_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.FSUSER AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:FSUSER AS VARCHAR(4000)) || '%')) OR (CAST(:FSUSER_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.FSUSER AS VARCHAR(4000)) = CAST(:FSUSER AS VARCHAR(4000))) OR (CAST(:FSUSER_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.FSUSER AS VARCHAR(4000)) <> CAST(:FSUSER AS VARCHAR(4000))) OR (CAST(:FSUSER_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.FSUSER AS VARCHAR(4000))) LIKE LOWER(CAST(:FSUSER AS VARCHAR(4000)) || '%')) OR (CAST(:FSUSER_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.FSUSER AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:FSUSER AS VARCHAR(4000)))))\nORDER BY FSUSER, SEC_TYPE, FSSETY"
