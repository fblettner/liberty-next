[[connectors.nomasx1.queries]]
name = "ldap_undefined_get"
label = "LDAP_UNDEFINED"
sql = "SELECT\n    USR_APPS_ID,\n    USR_ID,\n    USR_NAME,\n    USR_STATUS,\n    USR_REGISTRATION,\n    USR_DT_CREATION,\n    USR_DT_LOGIN\nFROM\n    SECURITY_USERS\nLEFT JOIN\n    SECURITY_LDAP A  ON  UPPER(A.LDAP_DESCRIPTION)  =  UPPER(USR_REGISTRATION) AND A.LDAP_APPS_ID = 50\nLEFT JOIN\n    SECURITY_LDAP B ON  UPPER(B.LDAP_ACCOUNT)  =  UPPER(USR_ID) AND B.LDAP_APPS_ID = 50\nWHERE\n    A.LDAP_LOGON IS NULL  AND B.LDAP_LOGON IS NULL\nORDER BY USR_APPS_ID,USR_NAME"
columns = [
    { name = "USR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "USR_ID" },
    { name = "USR_NAME" },
    { name = "USR_STATUS" },
    { name = "USR_REGISTRATION" },
    { name = "USR_DT_CREATION" },
    { name = "USR_DT_LOGIN" },
]

[[connectors.nomasx1.queries]]
name = "ldap_apps_get"
label = "LDAP_APPS"
sql = "SELECT\n  LDAPD_GROUP,\n  APPS_NAME,\n  LDAP_NAME,\n  LDAPD_DEPARTEMENT,\n  LDAP_DESCRIPTION,\n  LDAP_EXPIRES,\n  LDAP_COMPANY,\n  LDAP_TITLE,\n  USR_ID,\n  USR_NAME,\n  USR_REGISTRATION,\n  USR_STATUS,\n  USR_DT_LOGIN,\n  USR_DT_CREATION,\n  RLU_ROLE_ID FROM\n(\n  SELECT\n    LDAPD_GROUP,\n    C.APPS_NAME,\n    LDAP_NAME,\n    LDAPD_DEPARTEMENT,\n    LDAP_DESCRIPTION,\n    LDAP_EXPIRES,\n    LDAP_COMPANY,\n    LDAP_TITLE,\n    A.USR_ID,\n    A.USR_NAME,\n    A.USR_REGISTRATION,\n    A.USR_STATUS,\n    A.USR_DT_LOGIN,\n    A.USR_DT_CREATION,\n    (\n    SELECT \n      STRING_AGG(RLU_ROLE_ID, ',' ORDER BY RLU_ROLE_ID)      \n    FROM (\n      SELECT RLU_ROLE_ID FROM \n        SECURITY_ASSIGNMENTS\n      WHERE \n        RLU_USER_ID = A.USR_ID AND RLU_APPS_ID = A.USR_APPS_ID ORDER BY RLU_ROLE_ID) ALL_ASSIGNMENTS\n    ) RLU_ROLE_ID\n  FROM\n    SECURITY_LDAP_DPT\n  INNER JOIN\n    SECURITY_LDAP ON LDAP_DEPARTMENT = LDAPD_DEPARTEMENT\n  INNER JOIN\n    SETTINGS_APPLICATIONS LDAP  ON LDAP.APPS_ID = LDAP_APPS_ID\n  LEFT JOIN \n    (SECURITY_USERS A INNER JOIN SETTINGS_APPLICATIONS C  ON A.USR_APPS_ID = C.APPS_ID) ON \n      UPPER(A.USR_REGISTRATION)  =  UPPER(LDAP_DESCRIPTION)  \n      OR  UPPER(A.USR_ID)  =  UPPER(LDAP_ACCOUNT)\n    WHERE A.USR_ID IS NOT NULL\n  UNION ALL\n  SELECT\n    LDAPD_GROUP ,\n    APPS_NAME ,\n    LDAP_NAME ,\n    LDAPD_DEPARTEMENT,\n    LDAP_DESCRIPTION,\n    LDAP_EXPIRES,\n    LDAP_COMPANY,\n    LDAP_TITLE, NULL , NULL , NULL , NULL , NULL , NULL , NULL\n  FROM \n    SECURITY_LDAP_DPT\n  INNER JOIN \n    SECURITY_LDAP ON LDAP_DEPARTMENT = LDAPD_DEPARTEMENT\n  INNER JOIN \n    SETTINGS_APPLICATIONS ON APPS_ID = LDAP_APPS_ID\n) ALL_ROLES\nORDER BY LDAPD_GROUP,APPS_NAME,LDAP_NAME"
columns = [
    { name = "LDAPD_GROUP" },
    { name = "APPS_NAME" },
    { name = "LDAP_NAME" },
    { name = "LDAPD_DEPARTEMENT" },
    { name = "LDAP_DESCRIPTION" },
    { name = "LDAP_EXPIRES" },
    { name = "LDAP_COMPANY" },
    { name = "LDAP_TITLE" },
    { name = "USR_ID" },
    { name = "USR_NAME" },
    { name = "USR_REGISTRATION" },
    { name = "USR_STATUS" },
    { name = "USR_DT_LOGIN" },
    { name = "USR_DT_CREATION" },
    { name = "RLU_ROLE_ID" },
]

[[connectors.nomasx1.queries]]
name = "ldap_department_get"
label = "LDAP_DEPARTMENT"
sql = "SELECT  DISTINCT\n    APPS_ID,\n    APPS_NAME,\n    LDAPD_GROUP,\n    LDAP_DEPARTMENT\nFROM\n    SECURITY_LDAP\nINNER JOIN\n    SETTINGS_APPLICATIONS ON APPS_ID = LDAP_APPS_ID\nLEFT JOIN\n    SECURITY_LDAP_DPT ON LDAPD_DEPARTEMENT = LDAP_DEPARTMENT\nWHERE\n    LDAP_APPS_ID = 50\nORDER BY APPS_ID,APPS_NAME,LDAPD_GROUP,LDAP_DEPARTMENT"
columns = [
    { name = "APPS_ID" },
    { name = "APPS_NAME" },
    { name = "LDAPD_GROUP" },
    { name = "LDAP_DEPARTMENT" },
]

[[connectors.nomasx1.queries]]
name = "security_menus_get"
label = "SECURITY_MENUS"
sql = "WITH component as (\nSELECT\n  JDEO_APPS_ID,\n  JDEO_OBJECT,\n  CPT_ID,\n  CPT_COMPONENT\nFROM\n    JDE_OBJECTS\nINNER JOIN\n    SETTINGS_JDE_SY\n    ON JDEO_SY = SYC_ID\nINNER JOIN \n    SETTINGS_LIC_COMPONENTS\n    ON SYC_CPT_ID = CPT_ID\n)\nSELECT\n    MENU_APPS_ID,\n    MENU_LANGUAGE,\n    MENU_ROOT,\n    CPT_ID,\n    MENU_OBJECT,\n    MENU_FORM,\n    MENU_VERSION,\n    MENU_ID,\n    MENU_LEVEL1,\n    MENU_LEVEL2,\n    MENU_LEVEL3,\n    MENU_LEVEL4,\n    MENU_LEVEL5,\n    MENU_LEVEL6,\n    MENU_LEVEL7,\n    MENU_LEVEL8,\n    MENU_LEVEL9,\n    MENU_LEVEL10,\n    MENU_SEQ_UKID,\n    MENU_PARENT_ID,\n    MENU_CHILD_ID,\n    MENU_REFRESH,\n    MENU_UKID,\n    COALESCE(MENU_LEVEL9, \n    COALESCE(MENU_LEVEL8, \n    COALESCE(MENU_LEVEL7, \n    COALESCE(MENU_LEVEL6, \n    COALESCE(MENU_LEVEL5, \n    COALESCE(MENU_LEVEL4,MENU_LEVEL3, \n    COALESCE(MENU_LEVEL2, \n    COALESCE(MENU_LEVEL1, MENU_ROOT)))))))) MENU_LABEL\nFROM\n    SECURITY_MENUS\nLEFT JOIN\n    component\n    ON JDEO_APPS_ID = MENU_APPS_ID\n    AND JDEO_OBJECT = MENU_OBJECT\nORDER BY MENU_APPS_ID, MENU_SEQ_UKID"
columns = [
    { name = "MENU_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "MENU_ROOT" },
    { name = "MENU_OBJECT" },
    { name = "MENU_FORM" },
    { name = "MENU_VERSION" },
    { name = "CPT_ID" },
    { name = "MENU_ID" },
    { name = "MENU_LEVEL1" },
    { name = "MENU_LEVEL2" },
    { name = "MENU_LEVEL3" },
    { name = "MENU_LEVEL4", hidden = true },
    { name = "MENU_LEVEL5", hidden = true },
    { name = "MENU_LEVEL6", hidden = true },
    { name = "MENU_LEVEL7", hidden = true },
    { name = "MENU_LEVEL8", hidden = true },
    { name = "MENU_LEVEL9", hidden = true },
    { name = "MENU_LEVEL10", hidden = true },
    { name = "MENU_SEQ_UKID", hidden = true },
    { name = "MENU_REFRESH", hidden = true },
    { name = "UKID", dd = "MENU_UKID", hidden = true, format = "number" },
]

