[[connectors.nomasx1.queries]]
name = "ldap_undefined_get"
label = "LDAP_UNDEFINED"
description = "LDAP - Users undefined"
auto_load = true
sql = "SELECT\n    USR_APPS_ID,\n    USR_ID,\n    USR_NAME,\n    USR_STATUS,\n    USR_REGISTRATION,\n    USR_DT_CREATION,\n    USR_DT_LOGIN\nFROM\n    SECURITY_USERS\nLEFT JOIN\n    SECURITY_LDAP A  ON  UPPER(A.LDAP_DESCRIPTION)  =  UPPER(USR_REGISTRATION) AND A.LDAP_APPS_ID = 50\nLEFT JOIN\n    SECURITY_LDAP B ON  UPPER(B.LDAP_ACCOUNT)  =  UPPER(USR_ID) AND B.LDAP_APPS_ID = 50\nWHERE\n    A.LDAP_LOGON IS NULL  AND B.LDAP_LOGON IS NULL\nORDER BY USR_APPS_ID,USR_NAME"
columns = [
    { name = "USR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "USR_ID" },
    { name = "USR_NAME" },
    { name = "USR_STATUS" },
    { name = "USR_REGISTRATION" },
    { name = "USR_DT_CREATION" },
    { name = "USR_DT_LOGIN" },
]

[[connectors.nomasx1.queries]]
name = "ldap_apps_get"
label = "LDAP_APPS"
description = "LDAP - Users by application"
auto_load = true
sql = "SELECT\n  LDAPD_GROUP,\n  APPS_NAME,\n  LDAP_NAME,\n  LDAPD_DEPARTEMENT,\n  LDAP_DESCRIPTION,\n  LDAP_EXPIRES,\n  LDAP_COMPANY,\n  LDAP_TITLE,\n  USR_ID,\n  USR_NAME,\n  USR_REGISTRATION,\n  USR_STATUS,\n  USR_DT_LOGIN,\n  USR_DT_CREATION,\n  RLU_ROLE_ID FROM\n(\n  SELECT\n    LDAPD_GROUP,\n    C.APPS_NAME,\n    LDAP_NAME,\n    LDAPD_DEPARTEMENT,\n    LDAP_DESCRIPTION,\n    LDAP_EXPIRES,\n    LDAP_COMPANY,\n    LDAP_TITLE,\n    A.USR_ID,\n    A.USR_NAME,\n    A.USR_REGISTRATION,\n    A.USR_STATUS,\n    A.USR_DT_LOGIN,\n    A.USR_DT_CREATION,\n    (\n    SELECT \n      STRING_AGG(RLU_ROLE_ID, ',' ORDER BY RLU_ROLE_ID)      \n    FROM (\n      SELECT RLU_ROLE_ID FROM \n        SECURITY_ASSIGNMENTS\n      WHERE \n        RLU_USER_ID = A.USR_ID AND RLU_APPS_ID = A.USR_APPS_ID ORDER BY RLU_ROLE_ID) ALL_ASSIGNMENTS\n    ) RLU_ROLE_ID\n  FROM\n    SECURITY_LDAP_DPT\n  INNER JOIN\n    SECURITY_LDAP ON LDAP_DEPARTMENT = LDAPD_DEPARTEMENT\n  INNER JOIN\n    SETTINGS_APPLICATIONS LDAP  ON LDAP.APPS_ID = LDAP_APPS_ID\n  LEFT JOIN \n    (SECURITY_USERS A INNER JOIN SETTINGS_APPLICATIONS C  ON A.USR_APPS_ID = C.APPS_ID) ON \n      UPPER(A.USR_REGISTRATION)  =  UPPER(LDAP_DESCRIPTION)  \n      OR  UPPER(A.USR_ID)  =  UPPER(LDAP_ACCOUNT)\n    WHERE A.USR_ID IS NOT NULL\n  UNION ALL\n  SELECT\n    LDAPD_GROUP ,\n    APPS_NAME ,\n    LDAP_NAME ,\n    LDAPD_DEPARTEMENT,\n    LDAP_DESCRIPTION,\n    LDAP_EXPIRES,\n    LDAP_COMPANY,\n    LDAP_TITLE, NULL , NULL , NULL , NULL , NULL , NULL , NULL\n  FROM \n    SECURITY_LDAP_DPT\n  INNER JOIN \n    SECURITY_LDAP ON LDAP_DEPARTMENT = LDAPD_DEPARTEMENT\n  INNER JOIN \n    SETTINGS_APPLICATIONS ON APPS_ID = LDAP_APPS_ID\n) ALL_ROLES\nORDER BY LDAPD_GROUP,APPS_NAME,LDAP_NAME"
columns = [
    { name = "LDAPD_GROUP" },
    { name = "APPS_NAME" },
    { name = "LDAP_NAME" },
    { name = "LDAPD_DEPARTEMENT" },
    { name = "LDAP_DESCRIPTION" },
    { name = "LDAP_EXPIRES" },
    { name = "LDAP_COMPANY" },
    { name = "LDAP_TITLE" },
    { name = "USR_ID" },
    { name = "USR_NAME" },
    { name = "USR_REGISTRATION" },
    { name = "USR_STATUS" },
    { name = "USR_DT_LOGIN" },
    { name = "USR_DT_CREATION" },
    { name = "RLU_ROLE_ID" },
]

