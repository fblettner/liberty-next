# Liberty v2 — connector definitions (hot-reloadable; ${NAME} / ${NAME:-default} expand from the env).
#
# [pools.default] is the FRAMEWORK pool: it holds v2's own users/roles
# (ly2_users / ly2_roles / ly2_user_roles — created by `liberty-admin init-db`),
# shared across every app. Point it at a dedicated database — e.g. the old v1
# "libnsx1"/framework DB, or a fresh one. `[auth] pool` in config/app.toml points here.
#
# Per-app pools (one per business database) carry that app's queries. To add another v1
# app:  liberty-migrate sql --source-url <app-definition-db> -o migrated_<app>.toml
# then append its [pools.<app>] + [connectors.<app>] below and `POST /admin/reload`.

[pools.default]
# Set LIBERTY_DB_URL to the framework/users DB (e.g. postgresql+asyncpg://user:pw@host/libnsx1);
# otherwise this falls back to a local SQLite file so the app still runs out of the box.
url = "${LIBERTY_DB_URL:-sqlite+aiosqlite:///./liberty.db}"
pool_pre_ping = true

# ─────────────────────────────────────────────────────────────────────────────────────
# App: nomasx1 — "Rights, licenses and SOD". Set LIBERTY_DB_URL_NOMASX1 to its data DB
# (postgresql+asyncpg://user:pw@host/nomasx1). 208 queries migrated from the v1 libnsx1 DB.
# Query permission strings: sql:nomasx1:<query_name>  (or sql:nomasx1:* / sql:* / *).
# ─────────────────────────────────────────────────────────────────────────────────────
[pools.nomasx1]
url = "${LIBERTY_DB_URL_NOMASX1}"
pool_pre_ping = true

[connectors.nomasx1]
type = "sql"
pool = "nomasx1"

[[connectors.nomasx1.queries]]
name = "security_users_get"
label = "SECURITY_USERS"
description = "Security - Users"
auto_load = true
sql = "SELECT * FROM (\nSELECT\n    USR_APPS_ID,\n    USR_ID,\n    USR_NAME,\n    CASE WHEN USR_STATUS = '01' THEN '01' ELSE 'N' END USR_STATUS,\n    USR_DT_CREATION,\n    USR_DT_LOGIN,\n    USRP_TECHNICAL,\n    USRP_GENERIC,\n    USRP_ID_LINKED,\n    USR_REGISTRATION,\n    USR_DT_REFRESH,\n    USR_UKID,\n    (SELECT MAX(LOUT_USAGE) FROM LICENSE_JDE_OUT WHERE LOUT_USER = USR_ID AND LOUT_APPS_ID = USR_APPS_ID) LAST_USAGE,\n   USR_DT_UPDATE\nFROM\n    SECURITY_USERS\nLEFT JOIN\n    SECURITY_USERS_PROP\n    ON USRP_APPS_ID = USR_APPS_ID AND USRP_ID = USR_ID\n) _flt\nWHERE 1=1\n  AND ((CAST(:USR_ID AS VARCHAR(4000)) IS NULL OR CAST(:USR_ID AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:USR_ID_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.USR_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:USR_ID AS VARCHAR(4000)) || '%')) OR (CAST(:USR_ID_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.USR_ID AS VARCHAR(4000)) = CAST(:USR_ID AS VARCHAR(4000))) OR (CAST(:USR_ID_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.USR_ID AS VARCHAR(4000)) <> CAST(:USR_ID AS VARCHAR(4000))) OR (CAST(:USR_ID_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.USR_ID AS VARCHAR(4000))) LIKE LOWER(CAST(:USR_ID AS VARCHAR(4000)) || '%')) OR (CAST(:USR_ID_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.USR_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:USR_ID AS VARCHAR(4000)))))\nORDER BY USR_APPS_ID,USR_ID"
columns = [
    { name = "USR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "USR_ID", filter = true },
    { name = "USR_NAME" },
    { name = "USR_STATUS" },
    { name = "USR_DT_CREATION" },
    { name = "USR_DT_LOGIN" },
    { name = "LAST_USAGE" },
    { name = "USRP_TECHNICAL", hidden = true, format = "boolean" },
    { name = "USRP_GENERIC", hidden = true, format = "boolean" },
    { name = "USRP_ID_LINKED", hidden = true },
    { name = "USR_REGISTRATION", hidden = true },
    { name = "USR_DT_REFRESH", hidden = true },
    { name = "USR_UKID", hidden = true },
    { name = "USR_DT_UPDATE" },
]

