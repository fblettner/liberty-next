[[connectors.jdedwards.queries]]
name = "display_preference_user_role_put"
label = "Display Preference User / Role"
writable = true
sql = "MERGE INTO #SCHEMA.SY#.F00921 t\nUSING (\n  SELECT     \n    :ULUSER AS ULUSER,\n    :ULLNGP AS ULLNGP,\n    :ULCO AS ULCO,\n    :ULFRMT AS ULFRMT,\n    :ULDSEP AS ULDSEP,\n    :ULDECF AS ULDECF,\n    :ULVRSP AS ULVRSP,\n    :ULCUR AS ULCUR,\n    :ULCTR AS ULCTR,\n    :ULUTCTIME AS ULUTCTIME,\n    :ULTIMEFORM AS ULTIMEFORM,\n    :ULOMWLOG AS ULOMWLOG,\n    :ULRIGHTLEFT AS ULRIGHTLEFT,\n    :ULFUTTIME AS ULFUTTIME,\n    :ULFUTTIME1 AS ULFUTTIME1,\n    :ULFUTTIME2 AS ULFUTTIME2,\n    :ULFUTTIME3 AS ULFUTTIME3,\n    :ULFUTTIME4 AS ULFUTTIME4,\n    :ULFUTTIME5 AS ULFUTTIME5,\n    :ULFUTTIME6 AS ULFUTTIME6,\n    :ULFUTTIME7 AS ULFUTTIME7,\n    :ULFUTTIME8 AS ULFUTTIME8,\n    :ULMUSE AS ULMUSE,\n    :ULPID AS ULPID,\n    :ULJOBN AS ULJOBN,\n    :ULUPMJ AS ULUPMJ,\n    :ULUPMT AS ULUPMT\n  FROM dual) src\nON (t.ULUSER = src.ULUSER \n)\nWHEN MATCHED THEN\n  UPDATE SET \n    t.ULLNGP = src.ULLNGP,\n    t.ULCO = src.ULCO,\n    t.ULFRMT = src.ULFRMT,\n    t.ULDSEP = src.ULDSEP,\n    t.ULDECF = src.ULDECF,\n    t.ULVRSP = src.ULVRSP,\n    t.ULCUR = src.ULCUR,\n    t.ULCTR = src.ULCTR,\n    t.ULUTCTIME = src.ULUTCTIME,\n    t.ULTIMEFORM = src.ULTIMEFORM,\n    t.ULOMWLOG = src.ULOMWLOG,\n    t.ULRIGHTLEFT = src.ULRIGHTLEFT,\n    t.ULFUTTIME = src.ULFUTTIME,\n    t.ULFUTTIME1 = src.ULFUTTIME1,\n    t.ULFUTTIME2 = src.ULFUTTIME2,\n    t.ULFUTTIME3 = src.ULFUTTIME3,\n    t.ULFUTTIME4 = src.ULFUTTIME4,\n    t.ULFUTTIME5 = src.ULFUTTIME5,\n    t.ULFUTTIME6 = src.ULFUTTIME6,\n    t.ULFUTTIME7 = src.ULFUTTIME7,\n    t.ULFUTTIME8 = src.ULFUTTIME8,\n    t.ULMUSE = src.ULMUSE,\n    t.ULPID = src.ULPID,\n    t.ULJOBN = src.ULJOBN,\n    t.ULUPMJ = src.ULUPMJ,\n    t.ULUPMT = src.ULUPMT\nWHEN NOT MATCHED THEN\n  INSERT (\n    ULUSER,\n    ULLNGP,\n    ULCO,\n    ULFRMT,\n    ULDSEP,\n    ULDECF,\n    ULVRSP,\n    ULCUR,\n    ULCTR,\n    ULUTCTIME,\n    ULTIMEFORM,\n    ULOMWLOG,\n    ULRIGHTLEFT,\n    ULFUTTIME,\n    ULFUTTIME1,\n    ULFUTTIME2,\n    ULFUTTIME3,\n    ULFUTTIME4,\n    ULFUTTIME5,\n    ULFUTTIME6,\n    ULFUTTIME7,\n    ULFUTTIME8,\n    ULMUSE,\n    ULPID,\n    ULJOBN,\n    ULUPMJ,\n    ULUPMT)\n  VALUES (\n    src.ULUSER,\n    src.ULLNGP,\n    src.ULCO,\n    src.ULFRMT,\n    src.ULDSEP,\n    src.ULDECF,\n    src.ULVRSP,\n    src.ULCUR,\n    src.ULCTR,\n    src.ULUTCTIME,\n    src.ULTIMEFORM,\n    src.ULOMWLOG,\n    src.ULRIGHTLEFT,\n    src.ULFUTTIME,\n    src.ULFUTTIME1,\n    src.ULFUTTIME2,\n    src.ULFUTTIME3,\n    src.ULFUTTIME4,\n    src.ULFUTTIME5,\n    src.ULFUTTIME6,\n    src.ULFUTTIME7,\n    src.ULFUTTIME8,\n    src.ULMUSE,\n    src.ULPID,\n    src.ULJOBN,\n    src.ULUPMJ,\n    src.ULUPMT\n  )"

