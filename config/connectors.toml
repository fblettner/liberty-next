sql = "SELECT * FROM (\nWITH component as (\nSELECT \n    JDEO_APPS_ID,\n    JDEO_OBJECT,\n    JDEO_DESCRIPTION,\n    CPT_ID\nFROM\n    JDE_OBJECTS\nINNER JOIN\n    SETTINGS_JDE_SY\n    ON JDEO_SY = SYC_ID\nINNER JOIN SETTINGS_LIC_COMPONENTS\n    ON SYC_CPT_ID = CPT_ID\n)\nSELECT\n    LUSR_APPS_ID,\n    CPT_ID,\n    TRIM(LUSR_USER_ID) LUSR_USER_ID,\n    LUSR_TABLE_NAME,\n    JDEO_DESCRIPTION,\n    TO_CHAR(MAX(LUSR_DT_TRANSACTION),'yyyy-MM-dd') LUSR_DT_TRANSACTION\nFROM\n    LICENSE_JDE_USERS\nINNER JOIN\n    SETTINGS_APPLICATIONS\n    ON APPS_ID = LUSR_APPS_ID\nINNER JOIN\n    component\n    ON JDEO_APPS_ID = LUSR_APPS_ID\n    AND LUSR_TABLE_NAME = JDEO_OBJECT\nGROUP BY\n    LUSR_APPS_ID,\n    CPT_ID,\n    LUSR_USER_ID,\n    LUSR_TABLE_NAME,\n    JDEO_DESCRIPTION\n) _flt\nWHERE 1=1\n  AND ((CAST(:LUSR_APPS_ID AS VARCHAR(4000)) IS NULL OR CAST(:LUSR_APPS_ID AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:LUSR_APPS_ID_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.LUSR_APPS_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:LUSR_APPS_ID AS VARCHAR(4000)) || '%')) OR (CAST(:LUSR_APPS_ID_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.LUSR_APPS_ID AS VARCHAR(4000)) = CAST(:LUSR_APPS_ID AS VARCHAR(4000))) OR (CAST(:LUSR_APPS_ID_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.LUSR_APPS_ID AS VARCHAR(4000)) <> CAST(:LUSR_APPS_ID AS VARCHAR(4000))) OR (CAST(:LUSR_APPS_ID_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.LUSR_APPS_ID AS VARCHAR(4000))) LIKE LOWER(CAST(:LUSR_APPS_ID AS VARCHAR(4000)) || '%')) OR (CAST(:LUSR_APPS_ID_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.LUSR_APPS_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:LUSR_APPS_ID AS VARCHAR(4000)))))\n  AND ((CAST(:CPT_ID AS VARCHAR(4000)) IS NULL OR CAST(:CPT_ID AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:CPT_ID_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.CPT_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:CPT_ID AS VARCHAR(4000)) || '%')) OR (CAST(:CPT_ID_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.CPT_ID AS VARCHAR(4000)) = CAST(:CPT_ID AS VARCHAR(4000))) OR (CAST(:CPT_ID_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.CPT_ID AS VARCHAR(4000)) <> CAST(:CPT_ID AS VARCHAR(4000))) OR (CAST(:CPT_ID_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.CPT_ID AS VARCHAR(4000))) LIKE LOWER(CAST(:CPT_ID AS VARCHAR(4000)) || '%')) OR (CAST(:CPT_ID_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.CPT_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:CPT_ID AS VARCHAR(4000)))))\n  AND ((CAST(:LUSR_USER_ID AS VARCHAR(4000)) IS NULL OR CAST(:LUSR_USER_ID AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:LUSR_USER_ID_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.LUSR_USER_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:LUSR_USER_ID AS VARCHAR(4000)) || '%')) OR (CAST(:LUSR_USER_ID_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.LUSR_USER_ID AS VARCHAR(4000)) = CAST(:LUSR_USER_ID AS VARCHAR(4000))) OR (CAST(:LUSR_USER_ID_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.LUSR_USER_ID AS VARCHAR(4000)) <> CAST(:LUSR_USER_ID AS VARCHAR(4000))) OR (CAST(:LUSR_USER_ID_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.LUSR_USER_ID AS VARCHAR(4000))) LIKE LOWER(CAST(:LUSR_USER_ID AS VARCHAR(4000)) || '%')) OR (CAST(:LUSR_USER_ID_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.LUSR_USER_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:LUSR_USER_ID AS VARCHAR(4000)))))\n  AND ((CAST(:LUSR_TABLE_NAME AS VARCHAR(4000)) IS NULL OR CAST(:LUSR_TABLE_NAME AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:LUSR_TABLE_NAME_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.LUSR_TABLE_NAME AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:LUSR_TABLE_NAME AS VARCHAR(4000)) || '%')) OR (CAST(:LUSR_TABLE_NAME_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.LUSR_TABLE_NAME AS VARCHAR(4000)) = CAST(:LUSR_TABLE_NAME AS VARCHAR(4000))) OR (CAST(:LUSR_TABLE_NAME_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.LUSR_TABLE_NAME AS VARCHAR(4000)) <> CAST(:LUSR_TABLE_NAME AS VARCHAR(4000))) OR (CAST(:LUSR_TABLE_NAME_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.LUSR_TABLE_NAME AS VARCHAR(4000))) LIKE LOWER(CAST(:LUSR_TABLE_NAME AS VARCHAR(4000)) || '%')) OR (CAST(:LUSR_TABLE_NAME_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.LUSR_TABLE_NAME AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:LUSR_TABLE_NAME AS VARCHAR(4000)))))\nORDER BY LUSR_APPS_ID,CPT_ID,LUSR_USER_ID,LUSR_TABLE_NAME"
