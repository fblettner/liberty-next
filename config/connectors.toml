)) || '%')) OR (CAST(:CPT_ID_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.CPT_ID AS VARCHAR(4000)) = CAST(:CPT_ID AS VARCHAR(4000))) OR (CAST(:CPT_ID_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.CPT_ID AS VARCHAR(4000)) <> CAST(:CPT_ID AS VARCHAR(4000))) OR (CAST(:CPT_ID_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.CPT_ID AS VARCHAR(4000))) LIKE LOWER(CAST(:CPT_ID AS VARCHAR(4000)) || '%')) OR (CAST(:CPT_ID_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.CPT_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:CPT_ID AS VARCHAR(4000)))))\n  AND ((CAST(:SER_USER_ID AS VARCHAR(4000)) IS NULL OR CAST(:SER_USER_ID AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:SER_USER_ID_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.SER_USER_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:SER_USER_ID AS VARCHAR(4000)) || '%')) OR (CAST(:SER_USER_ID_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.SER_USER_ID AS VARCHAR(4000)) = CAST(:SER_USER_ID AS VARCHAR(4000))) OR (CAST(:SER_USER_ID_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.SER_USER_ID AS VARCHAR(4000)) <> CAST(:SER_USER_ID AS VARCHAR(4000))) OR (CAST(:SER_USER_ID_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.SER_USER_ID AS VARCHAR(4000))) LIKE LOWER(CAST(:SER_USER_ID AS VARCHAR(4000)) || '%')) OR (CAST(:SER_USER_ID_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.SER_USER_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:SER_USER_ID AS VARCHAR(4000)))))\n  AND ((CAST(:SER_OBJECT AS VARCHAR(4000)) IS NULL OR CAST(:SER_OBJECT AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:SER_OBJECT_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.SER_OBJECT AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:SER_OBJECT AS VARCHAR(4000)) || '%')) OR (CAST(:SER_OBJECT_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.SER_OBJECT AS VARCHAR(4000)) = CAST(:SER_OBJECT AS VARCHAR(4000))) OR (CAST(:SER_OBJECT_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.SER_OBJECT AS VARCHAR(4000)) <> CAST