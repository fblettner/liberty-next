[[connectors.nomasx1.queries]]
name = "security_assignments_get"
label = "SECURITY_ASSIGNMENTS"
description = "Security - Assignments"
auto_load = true
sql = "SELECT\n    RLU_APPS_ID,\n    RLU_USER_ID,\n    RLU_ROLE_ID,\n    RLU_DT_EFFECTIVE,\n    RLU_DT_EXPIRATION,\n    RLU_DT_REFRESH,\n    RLU_UKID\nFROM\n    SECURITY_ASSIGNMENTS\nINNER JOIN\n    SECURITY_USERS\n    ON USR_APPS_ID = RLU_APPS_ID AND USR_ID = RLU_USER_ID\nWHERE\n    USR_STATUS='01'\nORDER BY RLU_APPS_ID,RLU_USER_ID, RLU_ROLE_ID"
columns = [
    { name = "RLU_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "RLU_USER_ID", dd = "USR_ID" },
    { name = "RLU_ROLE_ID", dd = "ROL_ID" },
    { name = "RLU_DT_EFFECTIVE" },
    { name = "RLU_DT_EXPIRATION" },
    { name = "RLU_DT_REFRESH", hidden = true },
    { name = "RLU_UKID", hidden = true },
]

[[connectors.nomasx1.queries]]
name = "security_roles_not_used_get"
label = "SECURITY_ROLES_NOT_USED"
description = "Security - Roles not used"
auto_load = true
sql = "SELECT\n    APPS_ID,\n    ROL_ID\nFROM\n    SECURITY_ROLES\nINNER JOIN\n    SETTINGS_APPLICATIONS\n    ON APPS_ID = ROL_APPS_ID\nLEFT JOIN\n    SECURITY_ASSIGNMENTS\n    ON RLU_APPS_ID = ROL_APPS_ID AND RLU_ROLE_ID = ROL_ID\nWHERE\n    RLU_ROLE_ID IS NULL\nORDER BY APPS_ID,ROL_ID"
columns = [
    { name = "APPS_ID" },
    { name = "ROL_ID" },
]

[[connectors.nomasx1.queries]]
name = "security_users_without_roles_get"
label = "SECURITY_USERS_WITHOUT_ROLES"
description = "Security - Users without roles"
auto_load = true
sql = "SELECT\n    APPS_ID,\n    USR_ID,\n    USR_STATUS,\n    USR_DT_CREATION ,\n    USR_DT_LOGIN\nFROM\n    SECURITY_USERS\nINNER JOIN\n    SETTINGS_APPLICATIONS\n    ON APPS_ID = USR_APPS_ID\nLEFT JOIN\n    SECURITY_ASSIGNMENTS\n    ON RLU_APPS_ID = USR_APPS_ID AND RLU_USER_ID = USR_ID\nWHERE\n    RLU_USER_ID IS NULL\n    AND USR_STATUS = '01'\nORDER BY APPS_ID, USR_ID"
columns = [
    { name = "APPS_ID" },
    { name = "USR_ID" },
    { name = "USR_STATUS" },
    { name = "USR_DT_CREATION" },
    { name = "USR_DT_LOGIN" },
]

[[connectors.nomasx1.queries]]
name = "security_matrix_get"
label = "SECURITY_MATRIX"
description = "Security - Roles Matrix (combination roles for users)"
auto_load = true
sql = "SELECT\n  APPS_ID,\n  USERS_COUNT,\n  RLU_ROLE_ID,\n  USR_ID\nFROM\n  (\n  SELECT\n    APPS_ID,\n    RLU_ROLE_ID,\n    count(distinct USR_ID) USERS_COUNT,\n    MAX(USR_ID) USR_ID\n  FROM\n    (\n    SELECT\n      APPS_ID,\n      USR_ID,\n      (\n      SELECT\n        STRING_AGG(RLU_ROLE_ID, ',' ORDER BY RLU_ROLE_ID)\n      FROM\n        (\n        SELECT\n          RLU_ROLE_ID\n        FROM\n          SECURITY_ASSIGNMENTS\n        WHERE\n          RLU_USER_ID = USR_ID\n          AND RLU_APPS_ID = APPS_ID\n        ) ALL_ROLES\n      ) RLU_ROLE_ID\n      FROM\n        SECURITY_USERS\n      INNER JOIN\n        SETTINGS_APPLICATIONS\n        ON APPS_ID = USR_APPS_ID\n      WHERE\n        USR_STATUS = '01'\n    ) ROLES_DETAILS\n  GROUP BY\n    APPS_ID,\n    RLU_ROLE_ID\n  ) ROLES_MATRIX\nWHERE\n  TRIM(RLU_ROLE_ID) is not null\nORDER BY APPS_ID, USERS_COUNT DESC"
columns = [
    { name = "APPS_ID" },
    { name = "USERS_COUNT" },
    { name = "RLU_ROLE_ID" },
    { name = "USR_ID" },
]

[[connectors.nomasx1.queries]]
name = "security_duplicate_users_get"
label = "SECURITY_DUPLICATE_USERS"
description = "Security - Duplicate users"
auto_load = true
sql = "SELECT\n    USR_APPS_ID,\n    USR_ID,\n    USRD_AN8,\n    USR_STATUS,\n    USR_DT_CREATION ,\n    USR_DT_LOGIN ,\n    USRP_PRIVILEGED,\n    USRP_TECHNICAL,\n    USRP_GENERIC,\n    USRP_IS_LINKED,\n    USRP_ID_LINKED\nFROM\n    (\n    SELECT\n        USR_APPS_ID,\n        USR_ID,\n        USRD_AN8,\n        USR_REGISTRATION,\n        USR_STATUS,\n        USR_DT_CREATION,\n        USR_DT_LOGIN,\n        USRP_PRIVILEGED,\n        USRP_TECHNICAL,\n        USRP_GENERIC,\n        USRP_IS_LINKED,\n        USRP_ID_LINKED\n    FROM\n        SECURITY_USERS\n    INNER JOIN\n        SECURITY_USERS_DATA\n        ON USRD_APPS_ID = USR_APPS_ID AND USRD_ID = USR_ID\n    LEFT JOIN\n        SECURITY_USERS_PROP\n        ON USRP_APPS_ID = USR_APPS_ID AND USRP_ID = USR_ID\n    WHERE\n        (USRD_APPS_ID,USRD_AN8) IN\n        ( SELECT\n            USRD_APPS_ID,\n            USRD_AN8\n        FROM\n            SECURITY_USERS_DATA\n        GROUP BY\n            USRD_APPS_ID,USRD_AN8\n        HAVING\n            COUNT(*)  > 1 )\n        ) DUPLICATE_USERS\nORDER BY USR_APPS_ID,USR_ID"
columns = [
    { name = "USR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "USR_ID" },
    { name = "USRD_AN8" },
    { name = "USR_STATUS" },
    { name = "USR_DT_CREATION" },
    { name = "USR_DT_LOGIN" },
    { name = "USRP_PRIVILEGED", hidden = true },
    { name = "USRP_TECHNICAL", hidden = true },
    { name = "USRP_GENERIC", hidden = true },
    { name = "USRP_IS_LINKED" },
    { name = "USRP_ID_LINKED" },
]

