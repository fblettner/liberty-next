[[connectors.nomasx1.queries]]
name = "license_jde_out_get"
label = "LICENSE_JDE_OUT"
sql = "WITH component as (\nSELECT \n  JDEO_APPS_ID,\n  JDEO_OBJECT,\n  CPT_ID\nFROM\n  JDE_OBJECTS\nINNER JOIN\n  SETTINGS_JDE_SY\n  ON SYC_ID = JDEO_SY\nINNER JOIN \n  SETTINGS_LIC_COMPONENTS\n  ON SYC_CPT_ID = CPT_ID\n)\nSELECT \n  LOUT_APPS_ID,\n  CPT_ID,\n  COUNT(DISTINCT LOUT_USER) USERS_COUNT,\n  MAX(LOUT_USAGE) LAST_USAGE\nFROM\n  LICENSE_JDE_OUT\nINNER JOIN\n  component\n  ON JDEO_APPS_ID = LOUT_APPS_ID\n  AND JDEO_OBJECT = LOUT_OBJECT\nGROUP BY\n  LOUT_APPS_ID,\n  CPT_ID\nORDER BY LOUT_APPS_ID, CPT_ID"
