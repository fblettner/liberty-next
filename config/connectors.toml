]

[[connectors.nomasx1.queries]]
name = "get_last_refresh_get"
label = "Get Last Refresh"
description = "Get Last Refresh"
auto_load = true
sql = "SELECT\n    APPS_NAME,\n    AUD_MODULE,\n    SUBSTR(AUD_TABLE, POSITION('_' IN AUD_TABLE)+1) AUD_TABLE\nFROM (\nSELECT\n    APPS_ID ||' - ' || APPS_NAME APPS_NAME,\n    COALESCE(SUBSTR(AUD_TABLE, 0, POSITION('_' IN AUD_TABLE)), AUD_TABLE)  AUD_MODULE,\n    AUD_TABLE || ' : ' || TO_CHAR(MAX(AUD_AUDIT_DATE),'yyyy-MM-dd') AUD_TABLE\nFROM\n    SETTINGS_APPLICATIONS\nINNER JOIN\n    SECURITY_AUDIT\n    ON AUD_APPS_ID = APPS_ID\nGROUP BY\n    APPS_ID ||' - ' ||APPS_NAME ,\n    APPS_NAME,\n    COALESCE(SUBSTR(AUD_TABLE, 0, POSITION('_' IN AUD_TABLE)), AUD_TABLE),\n    AUD_TABLE\n)\nUNION ALL\nSELECT\n    APPS_NAME,\n    AUD_MODULE,\n    SUBSTR(AUD_TABLE, POSITION('_' IN AUD_TABLE)+1) AUD_TABLE\nFROM (\nSELECT\n    APPS_ID ||' - ' || APPS_NAME APPS_NAME,\n    COALESCE(SUBSTR(AUD_TABLE, 0, POSITION('_' IN AUD_TABLE)), AUD_TABLE)  AUD_MODULE,\n    AUD_TABLE || ' : ' || TO_CHAR(MAX(AUD_AUDIT_DATE),'yyyy-MM-dd') AUD_TABLE\nFROM\n    SETTINGS_APPLICATIONS\nINNER JOIN\n    DB_AUDIT\n    ON AUD_APPS_ID = APPS_ID\nGROUP BY\n    APPS_ID ||' - ' ||APPS_NAME ,\n    APPS_NAME,\n    COALESCE(SUBSTR(AUD_TABLE, 0, POSITION('_' IN AUD_TABLE)), AUD_TABLE),\n    AUD_TABLE\n)\nORDER BY APPS_NAME, AUD_MODULE, AUD_TABLE"
columns = [
    { name = "APPS_NAME" },
    { name = "AUD_MODULE" },
    { name = "AUD_TABLE" },
]

