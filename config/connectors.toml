sql = "SELECT\n    LUSR_APPS_ID,\n    LUSR_USER_ID,\n    LUSR_DT_TRANSACTION\nFROM (\nSELECT\n    LUSR_APPS_ID,\n    LUSR_USER_ID,\n    TO_CHAR(MAX(LUSR_DT_TRANSACTION),'yyyy-MM-dd') LUSR_DT_TRANSACTION\nFROM\n    LICENSE_JDE_USERS\nLEFT JOIN\n    SECURITY_USERS\n    ON USR_APPS_ID = LUSR_APPS_ID\n    AND TRIM(LUSR_USER_ID) = USR_ID\nWHERE\n    LUSR_APPS_ID  = LUSR_APPS_ID\n    AND USR_ID IS NULL\n    AND LUSR_DT_TRANSACTION  >= CURRENT_DATE  - 90\nGROUP BY\n    LUSR_APPS_ID,\n    LUSR_USER_ID\n) USERS_NOT_DECLARED\nORDER BY LUSR_APPS_ID,LUSR_USER_ID"
