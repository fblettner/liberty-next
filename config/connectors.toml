sql = "SELECT\n    USR_APPS_ID,\n    USR_ID,\n    USR_STATUS,\n    TO_CHAR(USR_DT_CREATION,'yyyy-MM-dd') USR_DT_CREATION,\n    TO_CHAR(USR_DT_LOGIN,'yyyy-MM-dd') USR_DT_LOGIN,\n    COALESCE(USRP_TECHNICAL,'N') USRP_TECHNICAL,\n    COALESCE(USRP_GENERIC,'N') USRP_GENERIC,\n    USRP_ID_LINKED\nFROM\n    SECURITY_USERS\nLEFT JOIN\n    SECURITY_USERS_PROP\n    ON USRP_APPS_ID = USR_APPS_ID AND USRP_ID = USR_ID\nWHERE\n    USR_STATUS IN ('01','Y')\n AND USR_ID IN (SELECT RLU_USER_ID FROM SECURITY_ASSIGNMENTS WHERE RLU_APPS_ID = USR_APPS_ID)\nORDER BY USR_APPS_ID,USR_ID"
