.FSATN2 = src.FSATN2,\n             t.FSATN3 = src.FSATN3,\n             t.FSMUSE = UPPER(src.FSMUSE),\n             t.FSPID = src.FSPID,\n             t.FSJOBN = src.FSJOBN,\n             t.FSUPMJ = src.FSUPMJ,\n             t.FSUPMT = src.FSUPMT,\n             t.FSEXITID = src.FSEXITID,\n             t.FSTABID = src.FSTABID,\n             t.FSTEXTID = src.FSTEXTID,\n             t.FSPTH = src.FSPTH\nWHEN NOT MATCHED THEN\n  INSERT (FSSETY, FSUSER, FSOBNM, FSDTAI, FSFRDV, FSSY, FSOWDI, FSFMNM, FSFUNO, FSINSL, FSRUN, FSVWYN, FSA, FSCHNG, FSDLT, FSTHDV, FSOBID, FSADDC, FSIOK, FSICPY, FSIUPT, FSATN1, FSATN2, FSATN3, FSMUSE, FSPID, FSJOBN, FSUPMJ, FSUPMT, FSEXITID, FSTABID, FSTEXTID, FSPTH)\n  VALUES (src.FSSETY, src.FSUSER, src.FSOBNM, src.FSDTAI, src.FSFRDV, src.FSSY, src.FSOWDI, src.FSFMNM, src.FSFUNO, src.FSINSL, src.FSRUN, src.FSVWYN, src.FSA, src.FSCHNG, src.FSDLT, src.FSTHDV, src.FSOBID, src.FSADDC, src.FSIOK, src.FSICPY, src.FSIUPT, src.FSATN1, src.FSATN2, src.FSATN3, UPPER(src.FSMUSE), src.FSPID, src.FSJOBN, src.FSUPMJ, src.FSUPMT, src.FSEXITID, src.FSTABID, src.FSTEXTID, src.FSPTH)"

