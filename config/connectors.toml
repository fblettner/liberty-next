[[connectors.nomasx1.queries]]
name = "security_roles_rights_get"
label = "SECURITY_ROLES_RIGHTS"
sql = "SELECT\n    SER_APPS_ID,\n    SER_ROLE_ID,\n    MENU_OBJECT,\n    MENU_FORM,\n    MENU_VERSION,\n    CASE WHEN TRIM(MENU_OBJECT) IS NULL\n        THEN NULL\n        ELSE SER_ROLE_ACTION_ID\n        END SER_ROLE_ACTION_ID,\n    CASE WHEN TRIM(MENU_OBJECT) IS NULL\n        THEN NULL\n        ELSE SER_ADD\n        END SER_ADD,\n    CASE WHEN TRIM(MENU_OBJECT) IS NULL\n        THEN NULL\n        ELSE SER_CHG\n        END SER_CHG,\n    CASE WHEN TRIM(MENU_OBJECT) IS NULL\n        THEN NULL\n        ELSE SER_DEL\n        END SER_DEL,\n    MENU_ROOT,\n    MENU_ID,\n    MENU_LEVEL1,\n    MENU_LEVEL2,\n    MENU_LEVEL3,\n    MENU_LEVEL4,\n    MENU_LEVEL5,\n    MENU_LEVEL6,\n    MENU_LEVEL7,\n    MENU_LEVEL8,\n    MENU_LEVEL9,\n    MENU_LEVEL10,\n    MENU_SEQ_UKID\nFROM\n    SECURITY_MENUS\nINNER JOIN\n    SECURITY_RIGHTS\n    ON MENU_APPS_ID = SER_APPS_ID\n    AND SER_MENU_SEQUKID = MENU_SEQ_UKID\n    AND SER_USER_ID = '*ROLE'\nWHERE\n    SER_RUN = 'Y'\nORDER BY MENU_SEQ_UKID"
columns = [
    { name = "SER_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "SER_ROLE_ID" },
    { name = "MENU_OBJECT", dd = "JDEO_OBJECT" },
    { name = "MENU_FORM" },
    { name = "MENU_VERSION" },
    { name = "SER_ROLE_ACTION_ID" },
    { name = "SER_ADD" },
    { name = "SER_CHG" },
    { name = "SER_DEL" },
    { name = "MENU_ROOT" },
    { name = "MENU_ID" },
    { name = "MENU_LEVEL1" },
    { name = "MENU_LEVEL2" },
    { name = "MENU_LEVEL3" },
    { name = "MENU_LEVEL4", hidden = true },
    { name = "MENU_LEVEL5", hidden = true },
    { name = "MENU_LEVEL6", hidden = true },
    { name = "MENU_LEVEL7", hidden = true },
    { name = "MENU_LEVEL8", hidden = true },
    { name = "MENU_LEVEL9", hidden = true },
    { name = "MENU_LEVEL10", hidden = true },
    { name = "MENU_SEQ_UKID" },
]

[[connectors.nomasx1.queries]]
name = "security_matrix_users_get"
label = "SECURITY_MATRIX_USERS"
sql = "SELECT\n    USR_APPS_ID,\n    USR_ID,\n    USR_NAME,\n    USR_STATUS,\n    USR_DT_CREATION,\n    USR_DT_LOGIN,\n    RLU_ROLE_ID\nFROM\n(\nSELECT\n    USR_APPS_ID,\n    USR_ID,\n    USR_NAME,\n    USR_STATUS,\n    USR_DT_CREATION,\n    USR_DT_LOGIN,\n    (\n        SELECT\n              STRING_AGG(RLU_ROLE_ID, ',' ORDER BY RLU_ROLE_ID) \n        FROM\n          (\n           SELECT\n              RLU_ROLE_ID\n           FROM\n             SECURITY_ASSIGNMENTS\n           WHERE\n             RLU_USER_ID = USR_ID\n              AND RLU_APPS_ID = USR_APPS_ID\n           ) ALL_ASSIGNMENTS\n    ) RLU_ROLE_ID\n    FROM\n        SECURITY_USERS\n    WHERE\n        USR_STATUS = '01'\n) MATRIX_USERS\nORDER BY USR_ID"
columns = [
    { name = "USR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "USR_ID" },
    { name = "USR_NAME" },
    { name = "USR_STATUS" },
    { name = "USR_DT_CREATION" },
    { name = "USR_DT_LOGIN" },
    { name = "RLU_ROLE_ID", hidden = true },
]

