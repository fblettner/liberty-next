[[connectors.nomasx1.queries]]
name = "security_menus_get"
label = "SECURITY_MENUS"
description = "Security - Menus"
sql = "SELECT * FROM (\nWITH component as (\nSELECT\n  JDEO_APPS_ID,\n  JDEO_OBJECT,\n  CPT_ID,\n  CPT_COMPONENT\nFROM\n    JDE_OBJECTS\nINNER JOIN\n    SETTINGS_JDE_SY\n    ON JDEO_SY = SYC_ID\nINNER JOIN \n    SETTINGS_LIC_COMPONENTS\n    ON SYC_CPT_ID = CPT_ID\n)\nSELECT\n    MENU_APPS_ID,\n    MENU_LANGUAGE,\n    MENU_ROOT,\n    CPT_ID,\n    MENU_OBJECT,\n    MENU_FORM,\n    MENU_VERSION,\n    MENU_ID,\n    MENU_LEVEL1,\n    MENU_LEVEL2,\n    MENU_LEVEL3,\n    MENU_LEVEL4,\n    MENU_LEVEL5,\n    MENU_LEVEL6,\n    MENU_LEVEL7,\n    MENU_LEVEL8,\n    MENU_LEVEL9,\n    MENU_LEVEL10,\n    MENU_SEQ_UKID,\n    MENU_PARENT_ID,\n    MENU_CHILD_ID,\n    MENU_REFRESH,\n    MENU_UKID,\n    COALESCE(MENU_LEVEL9, \n    COALESCE(MENU_LEVEL8, \n    COALESCE(MENU_LEVEL7, \n    COALESCE(MENU_LEVEL6, \n    COALESCE(MENU_LEVEL5, \n    COALESCE(MENU_LEVEL4,MENU_LEVEL3, \n    COALESCE(MENU_LEVEL2, \n    COALESCE(MENU_LEVEL1, MENU_ROOT)))))))) MENU_LABEL\nFROM\n    SECURITY_MENUS\nLEFT JOIN\n    component\n    ON JDEO_APPS_ID = MENU_APPS_ID\n    AND JDEO_OBJECT = MENU_OBJECT\n) _flt\nWHERE 1=1\n  AND ((CAST(:MENU_APPS_ID AS VARCHAR(4000)) IS NULL OR CAST(:MENU_APPS_ID AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:MENU_APPS_ID_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.MENU_APPS_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:MENU_APPS_ID AS VARCHAR(4000)) || '%')) OR (CAST(:MENU_APPS_ID_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.MENU_APPS_ID AS VARCHAR(4000)) = CAST(:MENU_APPS_ID AS VARCHAR(4000))) OR (CAST(:MENU_APPS_ID_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.MENU_APPS_ID AS VARCHAR(4000)) <> CAST(:MENU_APPS_ID AS VARCHAR(4000))) OR (CAST(:MENU_APPS_ID_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.MENU_APPS_ID AS VARCHAR(4000))) LIKE LOWER(CAST(:MENU_APPS_ID AS VARCHAR(4000)) || '%')) OR (CAST(:MENU_APPS_ID_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.MENU_APPS_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:MENU_APPS_ID AS VARCHAR(4000)))))\n  AND ((CAST(:MENU_ROOT AS VARCHAR(4000)) IS NULL OR CAST(:MENU_ROOT AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:MENU_ROOT_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.MENU_ROOT AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:MENU_ROOT AS VARCHAR(4000)) || '%')) OR (CAST(:MENU_ROOT_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.MENU_ROOT AS VARCHAR(4000)) = CAST(:MENU_ROOT AS VARCHAR(4000))) OR (CAST(:MENU_ROOT_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.MENU_ROOT AS VARCHAR(4000)) <> CAST(:MENU_ROOT AS VARCHAR(4000))) OR (CAST(:MENU_ROOT_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.MENU_ROOT AS VARCHAR(4000))) LIKE LOWER(CAST(:MENU_ROOT AS VARCHAR(4000)) || '%')) OR (CAST(:MENU_ROOT_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.MENU_ROOT AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:MENU_ROOT AS VARCHAR(4000)))))\n  AND ((CAST(:MENU_OBJECT AS VARCHAR(4000)) IS NULL OR CAST(:MENU_OBJECT AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:MENU_OBJECT_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.MENU_OBJECT AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:MENU_OBJECT AS VARCHAR(4000)) || '%')) OR (CAST(:MENU_OBJECT_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.MENU_OBJECT AS VARCHAR(4000)) = CAST(:MENU_OBJECT AS VARCHAR(4000))) OR (CAST(:MENU_OBJECT_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.MENU_OBJECT AS VARCHAR(4000)) <> CAST(:MENU_OBJECT AS VARCHAR(4000))) OR (CAST(:MENU_OBJECT_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.MENU_OBJECT AS VARCHAR(4000))) LIKE LOWER(CAST(:MENU_OBJECT AS VARCHAR(4000)) || '%')) OR (CAST(:MENU_OBJECT_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.MENU_OBJECT AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:MENU_OBJECT AS VARCHAR(4000)))))\n  AND ((CAST(:CPT_ID AS VARCHAR(4000)) IS NULL OR CAST(:CPT_ID AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:CPT_ID_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.CPT_ID AS VARCHAR(4000))) LIKE 