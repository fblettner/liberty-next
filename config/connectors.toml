[[connectors.jdedwards.queries]]
name = "merge_security_workbench_for_role_post"
label = "Merge Security Workbench for Role"
writable = true
sql = "INSERT INTO\n  #SCHEMA.SY#.F00950\nSELECT \n  FSSETY,\n  TRIM(RLTOROLE) FSUSER,\n  FSOBNM,\n  FSDTAI,\n  FSFRDV,\n  FSSY,\n  MAX(FSOWDI) FSOWDI,\n  MAX(FSFMNM) FSFMNM, \n  MAX(FSFUNO) FSFUNO,\n  MAX(FSINSL) FSINSL,\n  MAX(FSRUN) FSRUN,\n  MAX(FSVWYN) FSVWYN,\n  MAX(FSA) FSA,\n  MAX(FSCHNG) FSCHNG,\n  MAX(FSDLT) FSDLT,\n  MAX(FSTHDV) FSTHDV,\n  MAX(FSOBID) FSOBID,\n  MAX(FSADDC) FSADDC,\n  MAX(FSIOK) FSIOK,\n  MAX(FSICPY) FSICPY,\n  MAX(FSIUPT) FSIUPT,\n  MAX(FSATN1) FSATN1,\n  MAX(FSATN2) FSATN2,\n  MAX(FSATN3) FSATN3,\n  MAX(FSMUSE) FSMUSE,\n  MAX(FSPID) FSPID,\n  MAX(FSJOBN) FSJOBN,\n  MAX(FSUPMJ) FSUPMJ,\n  MAX(FSUPMT) FSUPMT,\n  MAX(FSEXITID) FSEXITID,\n  MAX(FSTABID) FSTABID,\n  MAX(FSTEXTID) FSTEXTID,\n  MAX(FSPTH) FSPTH\nFROM \n  #SCHEMA.SY#.F95921\nINNER JOIN \n  #SCHEMA.SY#.F00950 \n  ON FSUSER = RLFRROLE\nWHERE \n  RLTOROLE = :RLTOROLE\n  AND (RLEXPIRDATE = 0 OR RLEXPIRDATE > ((TO_CHAR(SYSDATE, 'YYYY') - 1900) * 1000 + TO_CHAR(SYSDATE, 'DDD')))\nGROUP BY\n FSSETY,\n RLTOROLE, \n FSOBNM, \n FSDTAI,\n FSFRDV,\n FSSY"

[[connectors.jdedwards.queries]]
name = "merge_udo_security_for_role_post"
label = "Merge UDO Security for Role"
writable = true
sql = "INSERT INTO #SCHEMA.SY#.F00950W\nWITH base AS (\n    SELECT\n        (SYSTIMESTAMP AT TIME ZONE 'UTC'\n         - TIMESTAMP '1970-01-01 00:00:00 UTC') AS diff\n    FROM dual\n)\nSELECT\n  SYS_CONTEXT('USERENV', 'IP_ADDRESS')\n    || ':'\n    || TRUNC(\n           EXTRACT(DAY    FROM b.diff) * 86400000\n         + EXTRACT(HOUR   FROM b.diff) * 3600000\n         + EXTRACT(MINUTE FROM b.diff) * 60000\n         + EXTRACT(SECOND FROM b.diff) * 1000\n       )\n    || ':' ||\n    (ROW_NUMBER() OVER (ORDER BY wswosety, wsobnm) - 1) AS WSOID,\n  WSWOSETY,\n  WSWOCAT,\n  WSWOUSER,\n  WSOBNM,\n  WSFMNM,\n  WSVER,\n  WSWOBNM,\n  WSSY,\n  WSSYR,\n  WSWOACTFLG,\n  (CASE WHEN WSWOSECLVL = 0 THEN 'NONE' WHEN WSWOSECLVL = 1 THEN 'CREATE'  WHEN WSWOSECLVL = 2 THEN 'SHARE' WHEN WSWOSECLVL = 3 THEN 'MODIFY' ELSE ' ' END) WSWOSECLVL,\n  WSWOVIEW,\n  WSWODELTPU,\n  WSWOUPDTPU,\n  WSWOADDPU,\n  WSWOADDPR,\n  WSWOACCESS,\n  WSWOSECOPT1,\n  WSWOSECOPT2,\n  WSWOSECOPT3,\n  WSWOSECOPT4,\n  WSWOVALUE1,\n  WSWOVALUE2,\n  WSWOUSERID,\n  WSWOPRGID,\n  WSWOMKEY,\n  WSWOUTIME,\n  WSWOTYP,\n  WSWOSUBCAT,\n  WSWOOBNMS,\n  WSWOFUTID1,\n  WSWOFUTID2,\n  WSWOFU1,\n  WSWOFU2,\n  WSWOFU3,\n  WSWOFU4,\n  WSWOFU5,\n  WSWOFU6,\n  WSWOFU7,\n  WSWOFU8,\n  WSWOFU9,\n  WSWOFU10\nFROM (\nSELECT \n  MAX(WSOID) WSOID,\n  WSWOSETY WSWOSETY,\n  WSWOCAT WSWOCAT,\n  RLTOROLE WSWOUSER,\n  WSOBNM WSOBNM, \n  WSFMNM WSFMNM,\n  WSVER WSVER,\n  WSWOBNM WSWOBNM,\n  WSSY WSSY,\n  WSSYR WSSYR,\n  MAX(WSWOACTFLG) WSWOACTFLG,\n  MAX(CASE WHEN WSWOSECLVL = 'NONE' THEN 0 WHEN WSWOSECLVL = 'CREATE' THEN 1 WHEN WSWOSECLVL = 'SHARE' THEN 2 WHEN WSWOSECLVL = 'MODIFY' THEN 3 END) WSWOSECLVL,\n  MAX(WSWOVIEW) WSWOVIEW,\n  MAX(WSWODELTPU) WSWODELTPU,\n  MAX(WSWOUPDTPU) WSWOUPDTPU,\n  MAX(WSWOADDPU) WSWOADDPU,\n  MAX(WSWOADDPR) WSWOADDPR,\n  MAX(WSWOACCESS) WSWOACCESS,\n  MAX(WSWOSECOPT1) WSWOSECOPT1,\n  MAX(WSWOSECOPT2) WSWOSECOPT2,\n  MAX(WSWOSECOPT3) WSWOSECOPT3,\n  MAX(WSWOSECOPT4) WSWOSECOPT4,\n  MAX(WSWOVALUE1) WSWOVALUE1,\n  MAX(WSWOVALUE2) WSWOVALUE2,\n  MAX(WSWOUSERID) WSWOUSERID,\n  MAX(WSWOPRGID) WSWOPRGID,\n  MAX(WSWOMKEY) WSWOMKEY,\n  MAX(WSWOUTIME) WSWOUTIME,\n  MAX(WSWOTYP) WSWOTYP,\n  MAX(WSWOSUBCAT) WSWOSUBCAT,\n  MAX(WSWOOBNMS) WSWOOBNMS,\n  MAX(WSWOFUTID1) WSWOFUTID1,\n  MAX(WSWOFUTID2) WSWOFUTID2,\n  MAX(WSWOFU1) WSWOFU1,\n  MAX(WSWOFU2) WSWOFU2,\n  MAX(WSWOFU3) WSWOFU3,\n  MAX(WSWOFU4) WSWOFU4,\n  MAX(WSWOFU5) WSWOFU5,\n  MAX(WSWOFU6) WSWOFU6,\n  MAX(WSWOFU7) WSWOFU7,\n  MAX(WSWOFU8) WSWOFU8,\n  MAX(WSWOFU9) WSWOFU9,\n  MAX(WSWOFU10) WSWOFU10\nFROM \n  #SCHEMA.SY#.F95921\nINNER JOIN \n  #SCHEMA.SY#.F00950W F1\n  ON WSWOUSER = RLFRROLE\nWHERE \n  RLTOROLE = :RLTOROLE\n  AND (RLEXPIRDATE = 0 OR RLEXPIRDATE > ((TO_CHAR(SYSDATE, 'YYYY') - 1900) * 1000 + TO_CHAR(SYSDATE, 'DDD')))\nGROUP BY\n  WSWOSETY,\n  WSWOCAT,\n  RLTOROLE,\n  WSOBNM,\n  WSFMNM,\n  WSVER,\n  WSWOBNM,\n  WSSY,\n  WSSYR\n)\nCROSS JOIN base b"

