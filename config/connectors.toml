[[connectors.jdedwards.queries]]
name = "udo_security_user_role_post"
label = "UDO Security User / Role"
writable = true
sql = "INSERT INTO\n  #SCHEMA.SY#.F00950W\nWITH base AS (\n    SELECT\n        (SYSTIMESTAMP AT TIME ZONE 'UTC'\n         - TIMESTAMP '1970-01-01 00:00:00 UTC') AS diff\n    FROM dual\n)\nSELECT \n     SYS_CONTEXT('USERENV', 'IP_ADDRESS')\n    || ':'\n    || TRUNC(\n           EXTRACT(DAY    FROM b.diff) * 86400000\n         + EXTRACT(HOUR   FROM b.diff) * 3600000\n         + EXTRACT(MINUTE FROM b.diff) * 60000\n         + EXTRACT(SECOND FROM b.diff) * 1000\n       )\n    || ':' ||\n    (ROW_NUMBER() OVER (ORDER BY wswosety, wsobnm) - 1) AS WSOID,\n    WSWOSETY,\n    WSWOCAT,\n    :TOUSER,\n    WSOBNM,\n    WSFMNM,\n    WSVER,\n    WSWOBNM,\n    WSSY,\n    WSSYR,\n    WSWOACTFLG,\n    WSWOSECLVL,\n    WSWOVIEW,\n    WSWODELTPU,\n    WSWOUPDTPU,\n    WSWOADDPU,\n    WSWOADDPR,\n    WSWOACCESS,\n    WSWOSECOPT1,\n    WSWOSECOPT2,\n    WSWOSECOPT3,\n    WSWOSECOPT4,\n    WSWOVALUE1,\n    WSWOVALUE2,\n    UPPER(:WSWOUSERID),\n    :WSWOPRGID,\n    :WSWOMKEY,\n    SYSDATE,\n    WSWOTYP,\n    WSWOSUBCAT,\n    WSWOOBNMS,\n    WSWOFUTID1,\n    WSWOFUTID2,\n    WSWOFU1,\n    WSWOFU2,\n    WSWOFU3,\n    WSWOFU4,\n    WSWOFU5,\n    WSWOFU6,\n    WSWOFU7,\n    WSWOFU8,\n    WSWOFU9,\n    WSWOFU10 \nFROM\n  #SCHEMA.SY#.F00950W\nCROSS JOIN base b\nWHERE\n  WSWOUSER = :FROMUSER"

