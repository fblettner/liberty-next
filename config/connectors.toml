[[connectors.nomasx1.queries]]
name = "license_usage_get"
label = "LICENSE_USAGE"
description = "License - Usage report"
auto_load = true
sql = "SELECT\n    APPS_ID,\n    CPT_ID,\n    USERS_COUNT,\n    ACTIVE_USERS_COUNT,\n    COALESCE(QUANTITY,0) SUBSCRIBED,\n    COALESCE(QUANTITY,0) - (CASE WHEN ACTIVE_USERS_COUNT = 0 THEN USERS_COUNT ELSE ACTIVE_USERS_COUNT END)  COMPLIANCE\nFROM\n(\n(SELECT\n    APPS_ID,\n    CPT_ID,\n    USERS_COUNT,\n    ACTIVE_USERS_COUNT\nFROM\n    LICENSE_JDE_USAGE\n) LINK_USERS\nLEFT JOIN \n(\nSELECT \n    LCA_APPS_ID,\n    LCC_CPT_ID,\n    SUM(LCC_QUANTITY) QUANTITY\nFROM\n    LICENSE_CSI_COMPONENTS\nINNER JOIN\n    LICENSE_CSI_APPS\n    ON LCA_CSI_ID = LCC_CSI_ID\nGROUP BY\n    LCA_APPS_ID,\n    LCC_CPT_ID\n) LICENSE_COMPONENTS\n    ON LCC_CPT_ID = CPT_ID \n    AND LCA_APPS_ID  = APPS_ID\n)\nORDER BY APPS_ID, CPT_ID"
columns = [
    { name = "APPS_ID" },
    { name = "CPT_ID" },
    { name = "USERS_COUNT" },
    { name = "ACTIVE_USERS_COUNT" },
    { name = "SUBSCRIBED" },
    { name = "COMPLIANCE" },
]

[[connectors.nomasx1.queries]]
name = "license_financial_get"
label = "LICENSE_FINANCIAL"
description = "License - Financial report"
auto_load = true
sql = "SELECT\n    APPS_ID,\n    CPT_ID,\n    COMPLIANCE,\n    ROUND(PRC_PRICE) PRC_PRICE,\n    ROUND(COMPLIANCE * PRC_PRICE) TOTAL_PRICE,\n    ROUND(PRC_SUPPORT) PRC_SUPPORT,\n    ROUND(COMPLIANCE * PRC_SUPPORT * 3) TOTAL_SUPPORT,\n    ROUND(COMPLIANCE * PRC_PRICE + COMPLIANCE * PRC_SUPPORT * 3) TOTAL_COMPLIANCE\nFROM\n((\nSELECT\n    APPS_ID,\n    CPT_ID,\n    USERS_COUNT,\n    ACTIVE_USERS_COUNT,\n    COALESCE(QUANTITY,0) SUBSCRIBED,\n    COALESCE(QUANTITY,0) - (CASE WHEN ACTIVE_USERS_COUNT = 0 THEN USERS_COUNT ELSE ACTIVE_USERS_COUNT END)  COMPLIANCE\nFROM\n(\n(SELECT\n    APPS_ID,\n    CPT_ID,\n    USERS_COUNT,\n    ACTIVE_USERS_COUNT\nFROM\n    LICENSE_JDE_USAGE\n) LINKED_USERS\nLEFT JOIN \n(\nSELECT \n    LCA_APPS_ID,\n    LCC_CPT_ID,\n    SUM(LCC_QUANTITY) QUANTITY\nFROM\n    LICENSE_CSI_COMPONENTS\nINNER JOIN\n    LICENSE_CSI_APPS\n    ON LCA_CSI_ID = LCC_CSI_ID\nGROUP BY\n    LCA_APPS_ID,\n    LCC_CPT_ID\n) ALL_COMPONENTS\n    ON LCC_CPT_ID = CPT_ID \n    AND LCA_APPS_ID  = APPS_ID\n) \n) ALL_COMPLIANCE\nINNER JOIN \n(\nSELECT \n    PRC_CPT_ID,\n    PRC_PRICE,\n    PRC_SUPPORT\nFROM\n    SETTINGS_LIC_PRICING\n) PRICING ON PRC_CPT_ID = CPT_ID\n) \nWHERE COMPLIANCE < 0"
columns = [
    { name = "APPS_ID" },
    { name = "CPT_ID" },
    { name = "COMPLIANCE" },
    { name = "PRC_PRICE" },
    { name = "TOTAL_PRICE" },
    { name = "PRC_SUPPORT" },
    { name = "TOTAL_SUPPORT" },
    { name = "TOTAL_COMPLIANCE" },
]

