[[connectors.nomasx1.queries]]
name = "audit_trail_query_get"
label = "AUDIT_TRAIL_QUERY"
sql = "SELECT \n    AUDIT_TRAIL_QUERY.AUD_APPS_ID,\n    AUDIT_TRAIL_QUERY.AUD_ROW_ID,\n    AUD_SCN,\n    AUD_DT_TRANSACTION,\n    AUD_OPERATION,\n    AUD_SEG_OWNER,\n    AUD_SEG_NAME,\n    AUD_SEG_TYPE,\n    AUD_SQL,\n    AUD_UNDO,\n    COALESCE(AUD_VALUE, AUDIT_TRAIL_QUERY.AUD_USERNAME) AUD_USERNAME \nFROM \n  AUDIT_TRAIL_QUERY\nLEFT JOIN\n  AUDIT_TRAIL_VALUES\n  ON AUDIT_TRAIL_QUERY.AUD_APPS_ID = AUDIT_TRAIL_VALUES.AUD_APPS_ID\n  AND AUDIT_TRAIL_QUERY.AUD_ROW_ID = AUDIT_TRAIL_VALUES.AUD_ROW_ID\n  AND RIGHT(AUDIT_TRAIL_VALUES.AUD_NAME,4)='USER' \n  AND LENGTH(AUDIT_TRAIL_VALUES.AUD_NAME) = 6  \n  AND AUD_TYPE = CASE WHEN AUD_OPERATION = 'DELETE' THEN 'BEFORE' ELSE 'AFTER' END\nORDER BY AUD_ROW_ID DESC"
columns = [
    { name = "AUD_APPS_ID", format = "number" },
    { name = "AUD_ROW_ID" },
    { name = "AUD_SCN" },
    { name = "AUD_DT_TRANSACTION" },
    { name = "AUD_OPERATION" },
    { name = "AUD_SEG_OWNER" },
    { name = "AUD_SEG_NAME" },
    { name = "AUD_SEG_TYPE" },
    { name = "AUD_SQL", hidden = true, format = "textarea" },
