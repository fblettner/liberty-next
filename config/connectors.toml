[[connectors.nomasx1.queries]]
name = "license_jde_users_transactions_get"
label = "LICENSE_JDE_USERS_TRANSACTIONS"
description = "License - Users with Transactions (JDE)"
auto_load = true
sql = "SELECT\n    USR_APPS_ID,\n    USR_ID,\n    USR_STATUS,\n    LUSR_DT_TRANSACTION\nFROM\n(\nSELECT DISTINCT\n    USR_APPS_ID,\n    USR_ID,\n    USR_STATUS,\n    TO_CHAR(MAX(LUSR_DT_TRANSACTION),'yyyy-MM-dd') LUSR_DT_TRANSACTION\nFROM\n    SECURITY_USERS\nINNER JOIN\n    LICENSE_JDE_USERS\n    ON LUSR_APPS_ID = USR_APPS_ID\n    AND TRIM(LUSR_USER_ID) = USR_ID\nWHERE\n    USR_STATUS = '01'\n    AND LUSR_DT_TRANSACTION  >= CURRENT_DATE  - 90\nGROUP BY\n    USR_APPS_ID,\n    USR_ID,\n    USR_STATUS\n) USERS_TRANSACTIONS\nORDER BY USR_APPS_ID,USR_ID"
columns = [
    { name = "USR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "USR_ID" },
    { name = "USR_STATUS" },
    { name = "LUSR_DT_TRANSACTION" },
]

