name = "license_jde_users_transactions_get"
label = "LICENSE_JDE_USERS_TRANSACTIONS"
sql = "SELECT\n    USR_APPS_ID,\n    USR_ID,\n    USR_STATUS,\n    LUSR_DT_TRANSACTION\nFROM\n(\nSELECT DISTINCT\n    USR_APPS_ID,\n    USR_ID,\n    USR_STATUS,\n    TO_CHAR(MAX(LUSR_DT_TRANSACTION),'yyyy-MM-dd') LUSR_DT_TRANSACTION\nFROM\n    SECURITY_USERS\nINNER JOIN\n    LICENSE_JDE_USERS\n    ON LUSR_APPS_ID = USR_APPS_ID\n    AND TRIM(LUSR_USER_ID) = USR_ID\nWHERE\n    USR_STATUS = '01'\n    AND LUSR_DT_TRANSACTION  >= CURRENT_DATE  - 90\nGROUP BY\n    USR_APPS_ID,\n    USR_ID,\n    USR_STATUS\n) USERS_TRANSACTIONS\nORDER BY USR_APPS_ID,USR_ID"
columns = [
    { name = "USR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "USR_ID" },
    { name = "USR_STATUS" },
    { name = "LUSR_DT_TRANSACTION" },
]

[[connectors.nomasx1.queries]]
name = "license_jde_no_transactions_get"
label = "LICENSE_JDE_NO_TRANSACTIONS"
sql = "SELECT\n    USR_APPS_ID,\n    USR_ID,\n    USR_STATUS,\n    USR_DT_CREATION,\n    USR_DT_LOGIN,\n    USRP_PRIVILEGED,\n    USRP_TECHNICAL,\n    USRP_GENERIC,\n    USRP_ID_LINKED\nFROM\n    SECURITY_USERS\nLEFT JOIN\n    LICENSE_JDE_USERS\n    ON LUSR_APPS_ID = USR_APPS_ID\n    AND TRIM(LUSR_USER_ID) = USR_ID\nLEFT JOIN\n    SECURITY_USERS_PROP\n    ON USRP_APPS_ID = USR_APPS_ID AND USRP_ID = USR_ID\nWHERE\n    USR_STATUS = '01'\n    AND LUSR_USER_ID IS NULL\nORDER BY USR_APPS_ID,USR_ID"
columns = [
    { name = "USR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "USR_ID" },
    { name = "USR_STATUS" },
    { name = "USR_DT_CREATION" },
    { name = "USR_DT_LOGIN" },
    { name = "USRP_PRIVILEGED" },
    { name = "USRP_TECHNICAL" },
    { name = "USRP_GENERIC" },
    { name = "USRP_ID_LINKED" },
]

[[connectors.nomasx1.queries]]
name = "license_jde_not_declared_get"
label = "LICENSE_JDE_NOT_DECLARED"
sql = "SELECT\n    LUSR_APPS_ID,\n    LUSR_USER_ID,\n    LUSR_DT_TRANSACTION\nFROM (\nSELECT\n    LUSR_APPS_ID,\n    LUSR_USER_ID,\n    TO_CHAR(MAX(LUSR_DT_TRANSACTION),'yyyy-MM-dd') LUSR_DT_TRANSACTION\nFROM\n    LICENSE_JDE_USERS\nLEFT JOIN\n    SECURITY_USERS\n    ON USR_APPS_ID = LUSR_APPS_ID\n    AND TRIM(LUSR_USER_ID) = USR_ID\nWHERE\n    LUSR_APPS_ID  = LUSR_APPS_ID\n    AND USR_ID IS NULL\n    AND LUSR_DT_TRANSACTION  >= CURRENT_DATE  - 90\nGROUP BY\n    LUSR_APPS_ID,\n    LUSR_USER_ID\n) USERS_NOT_DECLARED\nORDER BY LUSR_APPS_ID,LUSR_USER_ID"
columns = [
    { name = "LUSR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "LUSR_USER_ID" },
    { name = "LUSR_DT_TRANSACTION" },
]

[[connectors.nomasx1.queries]]
name = "license_jde_modules_transactions_get"
label = "LICENSE_JDE_MODULES_TRANSACTIONS"
sql = "WITH component as (\nSELECT \n    JDEO_APPS_ID,\n    JDEO_OBJECT,\n    CPT_ID\nFROM\n    JDE_OBJECTS\nINNER JOIN\n    SETTINGS_JDE_SY\n    ON JDEO_SY = SYC_ID\nINNER JOIN SETTINGS_LIC_COMPONENTS\n    ON SYC_CPT_ID = CPT_ID\n)\nSELECT\n    LUSR_APPS_ID,\n    CPT_ID,\n    COUNT(DISTINCT LUSR_USER_ID) USERS_COUNT\nFROM\n    LICENSE_JDE_USERS\nINNER JOIN\n    component\n    ON JDEO_APPS_ID = LUSR_APPS_ID\n    AND LUSR_TABLE_NAME = JDEO_OBJECT\nWHERE\n    LUSR_DT_TRANSACTION  >= CURRENT_DATE  - 90\nGROUP BY\n    LUSR_APPS_ID,\n    CPT_ID\nORDER BY LUSR_APPS_ID, CPT_ID"
columns = [
    { name = "LUSR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "CPT_ID" },
    { name = "USERS_COUNT" },
]

[[connectors.nomasx1.queries]]
name = "license_jde_modules_allowed_get"
label = "LICENSE_JDE_MODULES_ALLOWED"
sql = "SELECT\n    APPS_ID SER_APPS_ID,\n    CPT_ID,\n    USERS_COUNT,\n    ACTIVE_USERS_COUNT,\n    COALESCE(QUANTITY,0) SUBSCRIBED,\n    COALESCE(QUANTITY,0) - (CASE WHEN ACTIVE_USERS_COUNT = 0 THEN USERS_COUNT ELSE ACTIVE_USERS_COUNT END)  COMPLIANCE\nFROM\n(\n(SELECT\n    APPS_ID,\n    CPT_ID,\n    USERS_COUNT,\n    ACTIVE_USERS_COUNT\nFROM\n    LICENSE_JDE_USAGE\n) LINK_USERS\nLEFT JOIN \n(\nSELECT \n    LCA_APPS_ID,\n    LCC_CPT_ID,\n    SUM(LCC_QUANTITY) QUANTITY\nFROM\n    LICENSE_CSI_COMPONENTS\nINNER JOIN\n    LICENSE_CSI_APPS\n    ON LCA_CSI_ID = LCC_CSI_ID\nGROUP BY\n    LCA_APPS_ID,\n    LCC_CPT_ID\n) LICENSE_COMPONENTS\n    ON LCC_CPT_ID = CPT_ID \n    AND LCA_APPS_ID  = APPS_ID\n)\nORDER BY SER_APPS_ID, CPT_ID"
columns = [
    { name = "SER_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "CPT_ID" },
    { name = "USERS_COUNT" },
    { name = "ACTIVE_USERS_COUNT" },
]

[[connectors.nomasx1.queries]]
name = "license_jde_transactions_details_get"
label = "LICENSE_JDE_TRANSACTIONS_DETAILS"
sql = "WITH component as (\nSELECT \n    JDEO_APPS_ID,\n    JDEO_OBJECT,\n    JDEO_DESCRIPTION,\n    CPT_ID\nFROM\n    JDE_OBJECTS\nINNER JOIN\n    SETTINGS_JDE_SY\n    ON JDEO_SY = SYC_ID\nINNER JOIN SETTINGS_LIC_COMPONENTS\n    ON SYC_CPT_ID = CPT_ID\n)\nSELECT\n    LUSR_APPS_ID,\n    CPT_ID,\n    TRIM(LUSR_USER_ID) LUSR_USER_ID,\n    LUSR_TABLE_NAME,\n    JDEO_DESCRIPTION,\n    TO_CHAR(MAX(LUSR_DT_TRANSACTION),'yyyy-MM-dd') LUSR_DT_TRANSACTION\nFROM\n    LICENSE_JDE_USERS\nINNER JOIN\n    SETTINGS_APPLICATIONS\n    ON APPS_ID = LUSR_APPS_ID\nINNER JOIN\n    component\n    ON JDEO_APPS_ID = LUSR_APPS_ID\n    AND LUSR_TABLE_NAME = JDEO_OBJECT\nGROUP BY\n    LUSR_APPS_ID,\n    CPT_ID,\n    LUSR_USER_ID,\n    LUSR_TABLE_NAME,\n    JDEO_DESCRIPTION\nORDER BY LUSR_APPS_ID,CPT_ID,LUSR_USER_ID,LUSR_TABLE_NAME"
columns = [
    { name = "LUSR_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "CPT_ID" },
    { name = "LUSR_USER_ID", dd = "USR_ID" },
    { name = "LUSR_TABLE_NAME", dd = "JDEO_OBJECT" },
    { name = "LUSR_DT_TRANSACTION" },
]

[[connectors.nomasx1.queries]]
name = "license_jde_objects_allowed_get"
label = "LICENSE_JDE_OBJECTS_ALLOWED"
sql = "WITH component as (\nSELECT \n    JDEO_APPS_ID,\n    JDEO_OBJECT,\n    JDEO_DESCRIPTION,\n    CPT_ID\nFROM\n    JDE_OBJECTS\nINNER JOIN\n    SETTINGS_JDE_SY\n    ON JDEO_SY = SYC_ID\nINNER JOIN SETTINGS_LIC_COMPONENTS\n    ON SYC_CPT_ID = CPT_ID\n)\nSELECT\n    DISTINCT\n    SER_APPS_ID,\n    CPT_ID,\n    SER_USER_ID,\n    USRP_TECHNICAL,\n    USRP_IS_LINKED,\n    SER_OBJECT,\n    JDEO_DESCRIPTION\nFROM\n    SECURITY_RIGHTS\nINNER JOIN\n    SETTINGS_APPLICATIONS\n    ON APPS_ID = SER_APPS_ID\nINNER JOIN\n    component\n    ON JDEO_APPS_ID = SER_APPS_ID\n    AND  JDEO_OBJECT = SER_OBJECT\nLEFT JOIN\n    SECURITY_USERS_PROP\n    ON USRP_ID = SER_USER_ID AND (USRP_TECHNICAL = 'Y' OR USRP_IS_LINKED = 'Y')\n    AND USRP_APPS_ID= SER_APPS_ID\nWHERE \n    SER_USER_ID <> '*ROLE' AND SER_RUN = 'Y'\nORDER BY SER_APPS_ID,CPT_ID,SER_USER_ID,SER_OBJECT"
columns = [
    { name = "SER_APPS_ID", dd = "APPS_ID", format = "number" },
    { name = "CPT_ID" },
    { name = "SER_USER_ID", dd = "USR_ID" },
    { name = "USRP_TECHNICAL", format = "boolean" },
    { name = "USRP_IS_LINKED" },
    { name = "SER_OBJECT", dd = "JDEO_OBJECT" },
]

