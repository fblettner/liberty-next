sql = "WITH  Activity AS\n( SELECT  DISTINCT\n    ACL_APPS_ID,\n    TRIM(ACL_USER_ID) ACL_USER_ID,\n    ACL_TABLE_NAME\n    FROM\n        SECURITY_ACTIVITY_LOG\n)\nSELECT DISTINCT\n    CFD_APPS_ID,\n    CFD_PROCESS_ID,\n    CFD_RISK_ID,\n    CFD_USER_ID,\n    CFD_ACT1_ID,\n    CFD_ACT1_OBJECT,\n    CFD_ROLE1_ID,\n    CFD_ACT2_ID,\n    CFD_ACT2_OBJECT,\n    CFD_ROLE2_ID\nFROM\n    SOD_CONFLICT_DETAILS\nINNER JOIN\n    SECURITY_XREF G  ON G.XREF_APPS_ID = CFD_APPS_ID AND G.XREF_OBJECT_FROM = CFD_ACT1_OBJECT\nINNER JOIN\n    SECURITY_XREF H  ON H.XREF_APPS_ID = CFD_APPS_ID AND H.XREF_OBJECT_FROM = CFD_ACT2_OBJECT AND H.XREF_OBJECT_FROM <> G.XREF_OBJECT_FROM\nINNER JOIN  Activity I  ON I.ACL_APPS_ID = CFD_APPS_ID AND I.ACL_USER_ID = CFD_USER_ID AND I.ACL_TABLE_NAME = G.XREF_OBJECT_TO\nINNER JOIN  Activity J  ON J.ACL_APPS_ID = CFD_APPS_ID AND J.ACL_USER_ID = CFD_USER_ID AND J.ACL_TABLE_NAME = H.XREF_OBJECT_TO\nWHERE\n    I.ACL_TABLE_NAME <> J.ACL_TABLE_NAME\nORDER BY CFD_APPS_ID,CFD_PROCESS_ID,CFD_RISK_ID,CFD_USER_ID,CFD_ACT1_ID,CFD_ACT2_ID"
