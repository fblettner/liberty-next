sql = "SELECT * FROM (\nSELECT\n    USR_APPS_ID USRP_APPS_ID,\n    USR_ID USRP_ID,\n    USR_NAME USRP_NAME,\n    USRP_PRIVILEGED,\n    USRP_TECHNICAL,\n    USRP_GENERIC,\n    USRP_GENERIC_COUNT,\n    USRP_IS_LINKED,\n    USRP_ID_LINKED,\n    USRP_IS_PREVIOUS,\n    USRP_ID_PREVIOUS,\n    USRP_AUDIT_USER,\n    USRP_AUDIT_DATE,\n    USRP_UKID\n--    CASE WHEN USRP_ID IS NULL THEN 'Y' ELSE 'N' END ADD_ROW\nFROM\n    SECURITY_USERS\nLEFT JOIN\n    SECURITY_USERS_PROP\n    ON  USRP_APPS_ID = USR_APPS_ID  AND USRP_ID = USR_ID\n) _flt\nWHERE 1=1\n  AND ((CAST(:USRP_APPS_ID AS VARCHAR(4000)) IS NULL OR CAST(:USRP_APPS_ID AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:USRP_APPS_ID_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.USRP_APPS_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:USRP_APPS_ID AS VARCHAR(4000)) || '%')) OR (CAST(:USRP_APPS_ID_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.USRP_APPS_ID AS VARCHAR(4000)) = CAST(:USRP_APPS_ID AS VARCHAR(4000))) OR (CAST(:USRP_APPS_ID_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.USRP_APPS_ID AS VARCHAR(4000)) <> CAST(:USRP_APPS_ID AS VARCHAR(4000))) OR (CAST(:USRP_APPS_ID_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.USRP_APPS_ID AS VARCHAR(4000))) LIKE LOWER(CAST(:USRP_APPS_ID AS VARCHAR(4000)) || '%')) OR (CAST(:USRP_APPS_ID_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.USRP_APPS_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:USRP_APPS_ID AS VARCHAR(4000)))))\n  AND ((CAST(:USRP_ID AS VARCHAR(4000)) IS NULL OR CAST(:USRP_ID AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:USRP_ID_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.USRP_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:USRP_ID AS VARCHAR(4000)) || '%')) OR (CAST(:USRP_ID_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.USRP_ID AS VARCHAR(4000)) = CAST(:USRP_ID AS VARCHAR(4000))) OR (CAST(:USRP_ID_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.USRP_ID AS VARCHAR(4000)) <> CAST(:USRP_ID AS VARCHAR(4000))) OR (CAST(:USRP_ID_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.USRP_ID AS VARCHAR(4000))) LIKE LOWER(CAST(:USRP_ID AS VARCHAR(4000)) || '%')) OR (CAST(:USRP_ID_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.USRP_ID AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:USRP_ID AS VARCHAR(4000)))))\n  AND ((CAST(:USRP_TECHNICAL AS VARCHAR(4000)) IS NULL OR CAST(:USRP_TECHNICAL AS VARCHAR(4000)) = '') OR (COALESCE(CAST(:USRP_TECHNICAL_op AS VARCHAR(4000)), 'contains') = 'contains' AND LOWER(CAST(_flt.USRP_TECHNICAL AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:USRP_TECHNICAL AS VARCHAR(4000)) || '%')) OR (CAST(:USRP_TECHNICAL_op AS VARCHAR(4000)) = 'equals'     AND CAST(_flt.USRP_TECHNICAL AS VARCHAR(4000)) = CAST(:USRP_TECHNICAL AS VARCHAR(4000))) OR (CAST(:USRP_TECHNICAL_op AS VARCHAR(4000)) = 'notEquals'  AND CAST(_flt.USRP_TECHNICAL AS VARCHAR(4000)) <> CAST(:USRP_TECHNICAL AS VARCHAR(4000))) OR (CAST(:USRP_TECHNICAL_op AS VARCHAR(4000)) = 'startsWith' AND LOWER(CAST(_flt.USRP_TECHNICAL AS VARCHAR(4000))) LIKE LOWER(CAST(:USRP_TECHNICAL AS VARCHAR(4000)) || '%')) OR (CAST(:USRP_TECHNICAL_op AS VARCHAR(4000)) = 'endsWith'   AND LOWER(CAST(_flt.USRP_TECHNICAL AS VARCHAR(4000))) LIKE LOWER('%' || CAST(:USRP_TECHNICAL AS VARCHAR(4000)))))\nORDER BY USRP_APPS_ID, USRP_ID"
