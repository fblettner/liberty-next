[app]
name = "Liberty v2"
host = "0.0.0.0"
port = 8000
log_level = "info"

[connectors]
config_path = "config/connectors.toml"

# Internal-user authentication. The auth tables (ly2_users / ly2_roles) live on
# the connector pool named below; create them with `liberty-admin init-db`.
# jwt_secret signs the access/refresh JWTs — set it via the environment; if left
# empty an ephemeral key is generated at startup (dev only — tokens won't survive
# a restart).
[auth]
pool = "default"
jwt_secret = "${LIBERTY_JWT_SECRET}"
jwt_algorithm = "HS256"
jwt_issuer = "liberty-v2"
access_token_ttl = 3600          # seconds
refresh_token_ttl = 1209600      # seconds (14 days)

# OpenID Connect (Keycloak-ready). Disabled until enabled=true and a discovery
# URL is set; then /auth/oidc/login and /auth/oidc/callback become live and a
# cookie session is enabled for the OAuth state/nonce.
[oidc]
enabled = false
discovery_url = ""               # e.g. https://keycloak.example/realms/liberty/.well-known/openid-configuration
client_id = ""
client_secret = "${OIDC_CLIENT_SECRET}"
scopes = "openid email profile"
username_claim = "preferred_username"
email_claim = "email"
name_claim = "name"
redirect_url = ""                # override the auto-derived /auth/oidc/callback URL behind a proxy
session_secret = ""              # falls back to jwt_secret if empty

# Field-level encryption — for DB columns that hold encrypted secrets (e.g.
# SETTINGS_APPLICATIONS.password, ly_api_conn.conn_password). Must equal v1's MASTER_KEY
# so v1-encrypted values round-trip and other tools stay interoperable. The v1 stock
# default is "3zTvzr3p67VC61jmV54rIYu1545x4TlY" — set this to whatever your v1 secrets.json
# holds. Connector auth fields prefixed "ENC:" are decrypted at runtime with this key;
# `liberty-crypto encrypt|decrypt` and `from liberty.crypto import encrypt, decrypt` use it too.
[crypto]
master_key = "${LIBERTY_MASTER_KEY}"

# AI assistant — Anthropic Messages API with an agentic tool-use loop.
# POST /ai/chat streams Server-Sent Events; gated behind the `ai:chat` permission.
# Set api_key via the environment; if empty the endpoint exists but reports it
# unconfigured. The connectors are exposed as read-only tools (list_connectors,
# sql_query). web_fetch is Anthropic-hosted and stays off unless domains are set.
[ai]
enabled = true
api_key = "${ANTHROPIC_API_KEY}"
model = "claude-opus-4-7"
max_tokens = 8192
max_iterations = 8               # safety cap on tool-use round trips
system_prompt = ""               # empty → built-in default
thinking = false                 # enable adaptive thinking
effort = ""                      # "" | low | medium | high | xhigh | max (sent only when set; ignored for haiku)
request_timeout = 120.0
connector_tools = true           # expose list_connectors + sql_query (read-only queries only)
api_tool = false                 # expose api_call (off — API endpoints may have side effects)
allowed_connectors = []          # restrict which connectors the assistant may use; empty = all
web_fetch_domains = []           # e.g. ["docs.example.com"]; empty = web_fetch disabled
web_fetch_max_uses = 5
